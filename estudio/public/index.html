<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Estúdio — semvisão 3D</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 2rem; }
  h1 { font-size: 1.2rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #333; font-size: .9rem; }
  button { margin-right: .25rem; cursor: pointer; }
  .status-fila { color: #7fd; }
  .status-em_andamento { color: #fd7; }
  .status-pausado_revisao_humana { color: #f77; }
  .status-pausado_erro { color: #f44; font-weight: bold; }
  .status-concluido { color: #7f7; }
  .status-cancelado { color: #888; }
  form { margin-top: 1rem; display: flex; gap: .5rem; }
  input { padding: .3rem; }
</style>
</head>
<body>
<h1>Estúdio — fila de produções (modo simulado, nenhuma ação real ainda)</h1>
<form id="form-nova">
  <input id="titulo" placeholder="Título da produção" required>
  <button type="submit">Cadastrar</button>
</form>
<table>
  <thead><tr><th>#</th><th>Título</th><th>Etapa</th><th>Status</th><th>Motivo</th><th>Ações</th></tr></thead>
  <tbody id="corpo"></tbody>
</table>

<script>
async function carregar() {
  const lista = await fetch('/api/producoes').then(r => r.json());
  const corpo = document.getElementById('corpo');
  corpo.innerHTML = lista.map(p => `
    <tr>
      <td>${p.id}</td>
      <td>${p.titulo}</td>
      <td>${p.etapa}</td>
      <td class="status-${p.status}">${p.status}${p.tentativas ? ' (tentativas: ' + p.tentativas + ')' : ''}</td>
      <td>${p.motivo_pausa || ''}</td>
      <td>
        <button onclick="acao(${p.id},'avancar')">Avançar</button>
        <button onclick="acao(${p.id},'aprovar')">Aprovar</button>
        <button onclick="acao(${p.id},'pausar')">Pausar</button>
        <button onclick="acao(${p.id},'retomar')">Retomar</button>
        <button onclick="acao(${p.id},'tentar_de_novo')">Tentar de novo</button>
        <button onclick="acao(${p.id},'cancelar')">Cancelar</button>
      </td>
    </tr>
  `).join('');
}

async function acao(id, nome) {
  const r = await fetch(`/api/producoes/${id}/${nome}`, { method: 'POST' });
  if (!r.ok) alert((await r.json()).erro);
  carregar();
}

document.getElementById('form-nova').addEventListener('submit', async (e) => {
  e.preventDefault();
  const titulo = document.getElementById('titulo').value;
  await fetch('/api/producoes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo }) });
  document.getElementById('titulo').value = '';
  carregar();
});

carregar();
setInterval(carregar, 4000);
</script>
</body>
</html>
