<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dc-stage { position: absolute; inset: 0; z-index: 0; }
    #dc-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-cafe" data-width="1920" data-height="1080">
    <div id="dc-stage" class="clip" data-start="0" data-duration="30" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 15-22: 0-3 banheiro, a mãe chama (fora de quadro) · 3-7 a cozinha, a Duda chega · 7-12,5 a mãe
      // (ep2-maeduda-02) · 12,5-15 o rádio-relógio 00:00 · 15-18 a Duda (ep2-duda-02) · 18-22 a mãe pega o controle
      // (ep2-maeduda-03) · 22-26 a TV liga, chiado de canal · 26-30 as duas olhando o plantão
      const DUR = 30, CENA = "duda-cafe", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "manha", dentro: true });
      const { scene, casa, C, B, M } = W;
      const R = { refinado: true, material: "pbr" };
      const mae = Elenco.build("maeduda", Object.assign({ expr: "neutro", pose: "sentado" }, R)); scene.add(mae);
      const duda = Elenco.build("duda", Object.assign({ expr: "neutro", pose: "sentado" }, R)); scene.add(duda);
      const dudaPe = Elenco.build("duda", Object.assign({ expr: "neutro" }, R)); scene.add(dudaPe);
      EP2.senta(mae, C.cadeiras[0], 1.03, casa); EP2.senta(duda, C.cadeiras[1], 0.92, casa);
      // a toalha no peito (o fim do banheiro) e o controle da TV na mesa
      const kc = Cena.kit(casa, 17);
      const toalha = new THREE.Group(); casa.add(toalha); kc.box(0.5, 0.3, 0.05, 0xf2c4d0, 0, 0, 0, { pai: toalha });
      const controle = new THREE.Group(); casa.add(controle); kc.box(0.06, 0.03, 0.2, 0x22242a, 0, 0, 0, { pai: controle });
      const pal = EP2.palco("dc-stage");
      const tv = EP2.tv(pal.renderer);
      C.tv.material = tv.material;
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const P = B.pia, MX = C.MX, MZ = C.MZ;
      const planos = [
        { t0: 0, t1: 3, pos: M(P.x, 2.12, B.espelho.z + 0.02), alvo: M(P.x, 2.0, P.z + 0.95), fov: 40 },
        { t0: 3, t1: 7, pos: M(4.75, 2.55, -3.0), alvo: M(1.7, 1.25, -1.0), fov: 58 },
        { t0: 7, t1: 12.5, pos: M(2.95, 2.05, -2.85), alvo: M(1.6, 1.8, -1.95), fov: 50 },
        { t0: 12.5, t1: 15, pos: M(1.6, 1.55, -2.85), alvo: M(1.05, 1.22, -3.55), fov: 28 },
        { t0: 15, t1: 18, pos: M(2.8, 2.05, -2.95), alvo: M(2.55, 1.95, -1.15), fov: 34 },
        { t0: 18, t1: 22, pos: M(3.1, 1.95, -3.0), alvo: M(1.7, 1.6, -1.95), fov: 46 },
        { t0: 22, t1: 26, pos: M(3.3, 2.15, -1.15), alvo: M(5.1, 2.5, -2.1), fov: 34 },
        { t0: 26, t1: 30, pos: M(4.75, 2.35, -3.3), alvo: M(2.2, 1.5, -1.5), fov: 50 },
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        casa.updateMatrixWorld(true);
        const noBanheiro = t < 3, chegando = t >= 3 && t < 7;
        // banheiro: a Duda com a toalha no peito; ao ouvir a mãe, vira a cabeça para a porta
        dudaPe.visible = noBanheiro || chegando; duda.visible = t >= 7 || (chegando && t > 6.2);
        if (noBanheiro) {
          dudaPe.position.copy(M(P.x, 0, P.z + 0.95)); dudaPe.rotation.y = 0;
          const pt = M(P.x, 1.5, P.z + 0.62); toalha.visible = true; toalha.position.copy(casa.worldToLocal(pt.clone()));
          Elenco.duasMaos(dudaPe, pt.clone().add(V(0.18, 0, 0)), pt.clone().add(V(-0.18, 0, 0)));   // cada alvo na mão do seu lado
          Elenco.cabeca(dudaPe, 0, -0.55 * S((t - 0.9) / 0.7), 0);
          Elenco.vida(dudaPe, t, { ritmo: "calmo" });
        } else if (chegando) {
          // entra pela esquerda e vai até a cadeira (corta para sentada)
          toalha.visible = false;
          // entra pela frente (lado da janela) e vai reto até a cadeira dela: passa a mais de 1 m da mãe sentada
          const c = EP2.caminho([M(0.95, 0, -0.65), M(MX + 0.1, 0, MZ + 1.4)], (t - 3.4) / 2.6);
          dudaPe.visible = t < 6.2;
          dudaPe.position.copy(c.pos); dudaPe.rotation.y = c.ry;
          EP2.anda(dudaPe, t, t < 6.0 ? 1 : 0, 1.5);
          Elenco.cabeca(dudaPe, 0, 0, 0);
          Elenco.vida(dudaPe, t, { ritmo: "calmo" });
        } else toalha.visible = false;
        // a mãe: o controle na mesa; pega em 18,6-19,4 e aponta para a TV
        const pega = S((t - 18.6) / 0.8);
        const naMesa = M(MX - 0.5, C.MY + 0.02, MZ - 0.25);
        const naMao = mae.localToWorld(V(-0.12, 1.32, 0.42));
        if (t > 18.6) {
          Elenco.alcancar(mae, "esq", naMesa.clone().lerp(naMao, pega), { foraDoCorpo: true });
          controle.position.copy(casa.worldToLocal(naMesa.clone().lerp(naMao.clone().add(V(0, 0.03, 0)), pega)));
        } else controle.position.copy(casa.worldToLocal(naMesa.clone()));
        // olhares: a mãe para a TV (de frente); a Duda vira a cabeça para a TV quando ela liga
        Elenco.cabeca(mae, t > 22 ? -0.05 : 0.05, 0, 0);
        const viraTV = S((t - 22.4) / 0.6);
        Elenco.cabeca(duda, 0.05, (t < 15 ? 0.25 : 0) - 0.85 * viraTV, 0);
        Elenco.vida(mae, t, { ritmo: "calmo", fase: 1 }); Elenco.vida(duda, t, { ritmo: "calmo", fase: 2 });
        EP2.boca(mae, t, ["ep2-maeduda-02", "ep2-maeduda-03"], CENA);
        EP2.boca(duda, t, ["ep2-duda-02"], CENA);
        EP2.boca(dudaPe, t, [], CENA);
        // o rádio-relógio pisca 00:00; a TV: desligada → chiado (dois cliques) → o plantão
        C.radio.visible = (t % 1) < 0.6;
        tv.desenha(t, t < 22.6 ? "desligada" : t < 24.8 ? "chiado" : "estudio", null, false);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
