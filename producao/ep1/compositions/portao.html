        // 0-1,4 s chega andando pela calçada · 1,5-2,2 bate no portão · fala · 6,3+ olha a janela do quarto e vai embora

        duda.rotation.y = ry; duda.position.x = x;
        const passo = Math.sin(t * 9.5) * 0.45 * andando;
        rd.pL.hip.rotation.x = passo; rd.pR.hip.rotation.x = -passo;
        rd.pL.knee.rotation.x = Math.max(0, -passo) * 0.8; rd.pR.knee.rotation.x = Math.max(0, passo) * 0.8;

        rd.aL.el.rotation.x = -0.2; rd.aR.el.rotation.x = -0.2;
