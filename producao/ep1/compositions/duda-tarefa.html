<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #df-stage { position: absolute; inset: 0; z-index: 0; }
    #df-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-tarefa" data-width="1920" data-height="1080">
    <div id="df-stage" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 46-47 (o selo "+2 HORAS" e a fusão ficam na raiz): 0-5,5 a escrivaninha, a tarefa, a luz de fim de tarde ·
      // 5,5-10 fecha o caderno e olha a janela (ep2-duda-06 "Vou ver o Gabi.")
      const DUR = 10, CENA = "duda-tarefa", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "tarde", dentro: true });
      const { scene, casa, Q, M } = W;
      Q.cortina(0); Q.luzinhas(false);
      Q.cad.visible = false;                                        // a cadeira vira a dela (abaixo), no lugar certo
      const duda = Elenco.build("duda", { expr: "neutro", pose: "sentado", refinado: true, material: "pbr" }); casa.add(duda);
      // sentada de frente para a escrivaninha (parede +x), a ~0,85 dela
      const CX = Q.EX - 0.85, CZ = Q.EZ + 0.15;
      duda.position.set(CX, 0.75 + 0.1 - 1.075 * 0.92, CZ); duda.rotation.y = Math.PI / 2;
      const kc = Cena.kit(casa, 31);
      const cadeira = new THREE.Group(); cadeira.position.set(CX - 0.05, 0, CZ); cadeira.rotation.y = Math.PI / 2; casa.add(cadeira);
      kc.box(0.58, 0.07, 0.56, 0xf2c4d0, 0, 0.72, 0, { pai: cadeira }); kc.box(0.58, 0.62, 0.07, 0xf2c4d0, 0, 1.06, -0.26, { pai: cadeira });
      for (const [sx, sz] of [[-0.25, -0.23], [0.25, -0.23], [-0.25, 0.23], [0.25, 0.23]]) kc.box(0.045, 0.7, 0.045, 0xd9d2c6, sx, 0.35, sz, { pai: cadeira });
      const lapis = new THREE.Group(); casa.add(lapis); kc.cil(0.01, 0.01, 0.2, 0xd9b44a, 0, 0, 0, { pai: lapis, seg: 6 });
      const pal = EP2.palco("df-stage");
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const planos = [
        { t0: 0, t1: 5.5, pos: M(-1.2, 2.25, -2.6), alvo: M(Q.EX - 0.2, 1.35, Q.EZ + 0.1), fov: 46 },
        { t0: 5.5, t1: 10, pos: M(0.42, 2.1, -0.12), alvo: M(CX, 1.8, CZ), fov: 54 },   // na frente dela, do lado da janela: ao virar para a janela, o rosto vem para a câmera
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        casa.updateMatrixWorld(true);
        // escreve (a mão direita corre no caderno); em 6,2 fecha o caderno; depois olha a janela
        const fecha = S((t - 6.2) / 0.5);
        const pagina = M(Q.EX - 0.08 + 0.05 * Math.sin(t * 5), 1.22, Q.EZ + 0.12 + 0.03 * Math.sin(t * 2.3));
        Elenco.alcancar(duda, "dir", pagina, { foraDoCorpo: true });
        Elenco.alcancar(duda, "esq", M(Q.EX - 0.1, 1.22, Q.EZ + 0.45), { foraDoCorpo: true });
        lapis.position.copy(casa.worldToLocal(pagina.clone().add(V(0, 0.08, 0)))); lapis.rotation.set(0.5, 0, 0.4);
        lapis.visible = t < 6.2;
        Q.mesa.caderno.scale.z = 1 - 0.5 * fecha;                    // o caderno fecha (meia página)
        const janela = S((t - 7.0) / 0.6);
        Elenco.cabeca(duda, 0.3 * (1 - janela), 0.7 * janela, 0);   // da página para a janela
        EP2.expr(duda, t < 6.5 ? "neutro" : "firme");
        Elenco.vida(duda, t, { ritmo: "calmo" });
        EP2.boca(duda, t, ["ep2-duda-06"], CENA);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
