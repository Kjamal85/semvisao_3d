<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dq-stage { position: absolute; inset: 0; z-index: 0; }
    #dq-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-quarto" data-width="1920" data-height="1080">
    <div id="dq-stage" class="clip" data-start="0" data-duration="23" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 6-10: 0-3,5 o despertador 00:00 · 3,5-8,5 o relógio na mão (ep2-duda-01) · 8,5-12,5 vai à janela e abre a
      // cortina · 12,5-18 POV da janela (ep2-narrador-n02) · 18-23 o rosto dela na janela, visto de fora
      const DUR = 23, CENA = "duda-quarto", S = EP2.S;
      const W = EP2.mundo({ hora: "manha", dentro: true });
      const { scene, casa, Q, M } = W;
      Q.luzinhas(false);
      Q.cad.position.set(Q.EX - 0.5, 0, Q.EZ + 0.1); Q.cad.rotation.y = -Math.PI / 2;
      const R = { refinado: true, material: "pbr" };
      const sentada = Elenco.build("duda", Object.assign({ expr: "neutro", pose: "sentado" }, R));
      sentada.position.set(Q.BX + Q.BW / 2 + 0.05, Q.MT + 0.1 - 1.075 * 0.92, -1.75); sentada.rotation.y = Math.PI / 4; casa.add(sentada);
      const pe = Elenco.build("duda", Object.assign({ expr: "neutro" }, R)); casa.add(pe);
      // o despertador na mão dela (o mesmo modelo): uma caixinha com o visor piscando
      const kc = Cena.kit(casa, 9), relogio = new THREE.Group(); casa.add(relogio);
      kc.box(0.3, 0.15, 0.12, 0x1f2126, 0, 0, 0, { pai: relogio });
      const vis = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.075), Q.visor.material); vis.position.set(0, 0.01, 0.065); relogio.add(vis);
      const rs = sentada.userData.rig;
      const pal = EP2.palco("dq-stage");
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const JAN = M(-2.0, 2.05, -0.55);
      const planos = [
        { t0: 0, t1: 3.5, pos: M(Q.NX + 0.55, 1.25, Q.NZ + 0.55), alvo: M(Q.NX + 0.1, 0.88, Q.NZ + 0.05), fov: 30 },
        { t0: 3.5, t1: 8.5, pos: M(0.35, 1.9, -0.2), alvo: M(-0.7, 1.55, -1.85), fov: 52 },
        { t0: 8.5, t1: 12.5, pos: M(0.3, 2.3, -2.6), alvo: M(-1.9, 1.5, -0.4), fov: 56 },
        { t0: 12.5, t1: 18, pos: M(-1.5, 2.1, -1.9), alvo: EP2.V(0, 1.4, -6.5), fov: 38 },
        { t0: 18, t1: 23, pos: M(-1.75, 2.2, 1.8), alvo: M(-2.0, 2.08, -0.55), fov: 30 },
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        // o visor pisca 00:00 (1 Hz), na mesinha e na mão dela
        Q.visor.visible = (t % 1) < 0.6;
        const naMao = t >= 3.5 && t < 8.5;
        sentada.visible = naMao; relogio.visible = naMao;
        pe.visible = t >= 8.5 && !(t >= 12.5 && t < 18);   // no POV a câmera é o olhar dela
        for (const f of Q.folhas) f.visible = t < 18;          // de fora: sem as folhas, a cruz do caixilho não corta o rosto (boca à mostra)
        if (naMao) {
          EP2.expr(sentada, t < 5.5 ? "neutro" : "firme");     // franze a testa olhando o relógio
          casa.updateMatrixWorld(true);
          const mao = sentada.localToWorld(EP2.V(0.0, 1.32, 0.45));
          Elenco.alcancar(sentada, "dir", mao, { foraDoCorpo: true });
          Elenco.alcancar(sentada, "esq", sentada.localToWorld(EP2.V(-0.05, 1.28, 0.44)), { foraDoCorpo: true });
          relogio.position.copy(casa.worldToLocal(sentada.localToWorld(EP2.V(-0.02, 1.36, 0.5)))); relogio.rotation.set(-0.5, Math.PI / 4, 0);
          Elenco.cabeca(sentada, 0.18, 0, 0.05);
          Elenco.vida(sentada, t, { ritmo: "calmo", olhar: false });
          EP2.boca(sentada, t, ["ep2-duda-01"], CENA);
        }
        if (t >= 8.5) {
          // anda até a janela (8,6-10,4) e abre a cortina (10,6-12)
          const u = S((t - 8.6) / 1.8), a = EP2.V(-0.6, 0, -1.6), b = EP2.V(-2.0, 0, -0.62);
          pe.position.lerpVectors(a, b, u);
          pe.rotation.y = u < 0.85 ? Math.atan2(b.x - a.x, b.z - a.z) : Math.atan2(b.x - a.x, b.z - a.z) * (1 - S((u - 0.85) / 0.15));
          EP2.anda(pe, t, t > 8.6 && t < 10.3 ? 1 : 0, 1.5);
          const abre = S((t - 10.6) / 1.4);
          Q.cortina(1 - abre);
          if (t > 10.3 && t < 12.3) {
            casa.updateMatrixWorld(true);
            Elenco.alcancar(pe, "esq", M(-2.55 + 0.4 * (1 - abre), 2.0, -0.28), { foraDoCorpo: true });
            Elenco.alcancar(pe, "dir", M(-1.45 - 0.4 * (1 - abre), 2.0, -0.28), { foraDoCorpo: true });
          }
          Elenco.vida(pe, t, { ritmo: "calmo", fase: 2, corpo: t > 12 });
          EP2.boca(pe, t, [], CENA);
        } else Q.cortina(1);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
