<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #db-stage { position: absolute; inset: 0; z-index: 0; }
    #db-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-banheiro" data-width="1920" data-height="1080">
    <div id="db-stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 11-14 (sem voz), AÇÕES DE VERDADE (correção do usuário): 0-3 a escova com pasta na pia, a torneira abre e
      // a mão dela entra e pega · 3-6,5 no espelho, ESCOVANDO os dentes (a escova na boca, de um lado para o outro) e
      // devolvendo a escova · 6,5-9 as mãos DEBAIXO da água da torneira, esfregando · 9-12 a toalha PASSA pelo rosto e cobre
      // (esfrega), depois desce até o peito e o rosto aparece
      const DUR = 12, CENA = "duda-banheiro", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "manha", dentro: true });
      const { scene, casa, B, M } = W;
      const P = B.pia;
      const duda = Elenco.build("duda", { expr: "neutro", refinado: true, material: "pbr" });
      duda.position.set(P.x, 0, P.z + 0.95); duda.rotation.y = Math.PI; casa.add(duda);     // de frente para a pia (o espelho)
      // a água da torneira (um filete) e a toalha (grande o bastante para cobrir o rosto)
      const agua = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, 0.26, 10),
        new THREE.MeshToonMaterial({ color: 0xbfe0f0, gradientMap: B.k.grad, transparent: true, opacity: 0.7 }));
      agua.position.set(P.x, P.y + 0.15, P.z - 0.08); casa.add(agua);
      const kc = Cena.kit(casa, 13), toalha = new THREE.Group(); casa.add(toalha);
      // toalha macia (não uma placa): pano dobrado e amassado, do tamanho do rosto
      kc.bolha(0.24, 0xf2c4d0, 0, 0, 0, [1.05, 0.95, 0.22], { pai: toalha });
      kc.bolha(0.12, 0xeab3c2, 0.05, -0.19, 0.03, [1.6, 0.55, 0.35], { pai: toalha });
      const escova = B.escova, ESC0 = { p: escova.position.clone(), r: escova.rotation.clone() };
      const pal = EP2.palco("db-stage");
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const planos = [
        { t0: 0, t1: 3, pos: M(P.x + 0.85, P.y + 0.38, P.z + 0.6), alvo: M(P.x + 0.4, P.y + 0.03, P.z + 0.15), fov: 32 },
        // no espelho: cabeça inteira e parte do tronco
        { t0: 3, t1: 6.5, pos: M(P.x, 2.1, B.espelho.z + 0.02), alvo: M(P.x, 1.92, P.z + 0.95), fov: 52 },
        { t0: 6.5, t1: 9, pos: M(P.x + 0.6, P.y + 0.6, P.z + 0.35), alvo: M(P.x, P.y + 0.1, P.z - 0.05), fov: 36 },
        { t0: 9, t1: 12, pos: M(P.x, 2.1, B.espelho.z + 0.02), alvo: M(P.x, 1.92, P.z + 0.95), fov: 52 },
      ];
      const estado = { t: 0 };
      const _a = V(0, 0, 0), _b = V(0, 0, 0);
      function eixos() {
        // frente / direita / cima da Duda no mundo, e a cabeça
        duda.updateMatrixWorld(true);
        const o = duda.localToWorld(_a.set(0, 0, 0)).clone();
        const fr = duda.localToWorld(_b.set(0, 0, 1)).clone().sub(o).normalize();
        const esq = duda.localToWorld(_b.set(1, 0, 0)).clone().sub(o).normalize();
        const cab = duda.userData.rig.head.getWorldPosition(V(0, 0, 0));
        return { fr, esq, cab };
      }
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        const aberta = t > 0.8 && t < 9.2;
        agua.visible = aberta; agua.scale.y = aberta ? 1 + 0.03 * Math.sin(t * 40) : 1;
        const g = duda, rg = g.userData.rig;
        let inclina = 0;
        toalha.visible = false;
        escova.position.copy(ESC0.p); escova.rotation.copy(ESC0.r);
        Elenco.cabeca(g, 0.06, 0, 0);
        casa.updateMatrixWorld(true);
        const E = eixos();
        const boca = E.cab.clone().addScaledVector(E.fr, 0.31).add(V(0, -0.19, 0));
        // a mão apoiada na beira da pia, do lado s (+1 = esquerda DELA, -1 = direita): pelos eixos do corpo, não da casa
        const repouso = (s) => M(P.x, P.y + 0.06, P.z + 0.3).addScaledVector(E.esq, s * 0.3);
        const escovaMesa = M(ESC0.p.x, ESC0.p.y + 0.02, ESC0.p.z);
        if (t < 6.5) {
          // pega a escova (2,0-2,8), leva à boca (2,8-3,4), escova (3,4-5,6), devolve (5,6-6,4)
          const pega = S((t - 2.0) / 0.8), leva = S((t - 2.8) / 0.6), devolve = S((t - 5.6) / 0.8);
          const vai = Math.max(0, leva - devolve);                                       // 1 = escova na boca
          const lado = 0.04 * Math.sin(t * 2 * Math.PI * 3.2) * S((t - 3.4) / 0.2) * (1 - S((t - 5.5) / 0.2));
          const naBoca = boca.clone().addScaledVector(E.esq, -lado);
          // a escova: as cerdas (z local +0,09) na boca, o cabo saindo para a direita dela
          const cabo = naBoca.clone().addScaledVector(E.esq, -0.16).addScaledVector(E.fr, 0.05).add(V(0, -0.03, 0));
          let mao = repouso(-1);
          if (pega > 0 && devolve < 1) {
            const comEscova = pega >= 1;
            // a palma (o ponto do alcance) fica abaixo e por fora do cabo: os dedos fecham em volta dele, a mão não sobe até o olho
            const destino = escovaMesa.clone().lerp(cabo.clone().addScaledVector(E.esq, -0.05).add(V(0, -0.09, 0)), vai);
            mao = comEscova ? destino : repouso(-1).lerp(escovaMesa, pega);
            if (comEscova) {
              const pontaW = escovaMesa.clone().lerp(naBoca, vai), caboW = escovaMesa.clone().lerp(cabo, vai);
              escova.position.copy(casa.worldToLocal(caboW.clone()));
              if (vai > 0.02) { escova.lookAt(pontaW); escova.position.copy(casa.worldToLocal(caboW.clone().lerp(pontaW, 0.5))); }
            }
          } else if (devolve >= 1) mao = escovaMesa.clone().lerp(repouso(-1), S((t - 6.4) / 0.3));
          Elenco.duasMaos(g, repouso(1), mao);
          inclina = 0.08 * vai;
        } else if (t < 9) {
          // as duas mãos DEBAIXO do filete, esfregando uma na outra (cada uma do seu lado do filete)
          const esf = 0.035 * Math.sin(t * 2 * Math.PI * 2.4);
          const base = M(P.x, P.y + 0.07, P.z - 0.07);
          Elenco.duasMaos(g, base.clone().addScaledVector(E.esq, 0.055).addScaledVector(E.fr, esf),
                             base.clone().addScaledVector(E.esq, -0.055).addScaledVector(E.fr, -esf));
          Elenco.mao(g, "esq", "aberta", 1); Elenco.mao(g, "dir", "aberta", 1);
          inclina = 0.14;
        } else {
          // a toalha sobe do peito (9,0-9,5), cobre o rosto e esfrega (9,5-11,0), desce até o peito (11,0-11,6)
          const sobe = S((t - 9.0) / 0.5), desce = S((t - 11.0) / 0.6);
          const rosto = E.cab.clone().addScaledVector(E.fr, 0.4).add(V(0, -0.04, 0));
          const peito = E.cab.clone().addScaledVector(E.fr, 0.5).add(V(0, -0.75, 0));
          const esfrega = (sobe >= 1 && desce <= 0) ? 0.035 : 0;
          const alvo = peito.clone().lerp(rosto, sobe * (1 - desce))
            .addScaledVector(E.esq, esfrega * Math.sin(t * 9)).add(V(0, esfrega * Math.cos(t * 9) * 0.6, 0));
          toalha.visible = true;
          toalha.position.copy(casa.worldToLocal(alvo.clone()));
          toalha.rotation.set(0, Math.PI, 0);
          Elenco.duasMaos(g, alvo.clone().addScaledVector(E.esq, 0.2).addScaledVector(E.fr, -0.03),
                             alvo.clone().addScaledVector(E.esq, -0.2).addScaledVector(E.fr, -0.03));
        }
        Elenco.cabeca(g, 0.06 + inclina, 0, 0);
        Elenco.vida(g, t, { ritmo: "calmo", olhar: false, piscar: t < 9 || t > 11.5 });
        EP2.boca(g, t, [], CENA);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
