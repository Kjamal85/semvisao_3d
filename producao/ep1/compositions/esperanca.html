      // a mão esquerda enfaixada, apoiada na mesa
      const gaze = new THREE.MeshToonMaterial({ color: 0xf6f3ea, gradientMap: k.grad });
      const fx = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.082, 0.15, 16), gaze); fx.position.set(0, -0.06, 0); fx.scale.set(1.1, 1.1, 1.1); rg.aR.mao.g.add(fx);

      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.03;

      const rosto = new THREE.PointLight(0xe8dccb, 1.3, 4, 1.6); rosto.position.set(MX, 2.4, MZ + 1.6); raiz.add(rosto);

      const _m = new THREE.Matrix4(), _p = V(), _q = new THREE.Quaternion(), _s = V();

        const t = estado.t;

        Elenco.mao(gabi, "dir", t > PEGA && t < C2 ? "segura" : "aberta", 1);
        raiz.updateMatrixWorld(true);

        if (t >= PEGA && t < C2 - 0.3) {

          copo.position.set(_p.x + 0.07, _p.y - 0.06, _p.z + 0.05);
          copo.rotation.set(-0.9 * S((t - BEBE) / 0.4) * (1 - S((t - BAIXA + 0.4) / 0.4)), 0, 0);
        } else { copo.position.copy(COPO0); copo.rotation.set(0, 0, 0); }

        if (t >= FONE) { if (fone.parent !== rg.head) rg.head.add(fone); fone.position.set(0, 0.05, 0); fone.rotation.set(0, 0, 0); fone.scale.set(2.55, 2.4, 2.4); }
        else { if (fone.parent !== raiz) raiz.add(fone); fone.position.copy(FONE0.pos); fone.rotation.copy(FONE0.rot); fone.scale.set(1, 1, 1); }
        // ---- caras: concentrado -> meio-sorriso (54) -> ouvindo a música; a mãe ensina e se alivia ----
        expr(gabi, t < BAIXA + 0.2 ? "firme" : "ternura");
        Elenco.cabeca(gabi, 0.12 - 0.08 * S((t - BEBE) / 0.4) * (1 - S((t - BAIXA) / 0.4)), 0.1 + (t > FONE ? Math.sin(t * 1.4) * 0.08 : 0), (t > FONE ? Math.sin(t * 1.4 + 1) * 0.06 : 0), Math.sin(t * 2 * Math.PI * 0.3) * 0.008);

        Elenco.cabeca(mae, 0.2 - 0.12 * S((t - C3) / 0.6), -0.1, 0.05 * S((t - C3) / 0.6), Math.sin(t * 2 * Math.PI * 0.28) * 0.008);
        // ---- planos ----

        else if (t < C2) { cam.fov = 50; cam.position.set(MX - 1.55, 1.75, MZ + 0.25); alvo = V(MX - 0.45, 1.6, MZ - 0.75); }            // 3/4: bebe
        else if (t < C3) { cam.fov = 38; const u = S((t - C2) / 2.5); cam.position.set(MX - 0.35, 2.15, MZ + 1.55 - 0.25 * u); alvo = V(MX - 0.45, 1.85, MZ - 0.9); }   // o fone
        else { cam.fov = 36; cam.position.set(MX + 0.25, 2.1, MZ + 1.3); alvo = V(MX + 0.45, 1.9, MZ - 0.6); }                              // a mãe, aliviada
        cam.updateProjectionMatrix(); cam.lookAt(alvo);
        // 54: a vinheta recua (o olho "abre" um pouco)
