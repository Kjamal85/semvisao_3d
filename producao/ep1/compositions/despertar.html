<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dp-stage { position: absolute; inset: 0; z-index: 0; }
    #dp-stage canvas { display: block; }
    #dp-preto { position: absolute; inset: 0; z-index: 1; background: #000; }
    #dp-rotulo { position: absolute; left: 60px; bottom: 50px; z-index: 2; padding: 14px 22px;
      background: rgba(10, 12, 18, 0.72); color: #e9ecf2; font-family: sans-serif;
      font-size: 30px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; }
    #dp-rotulo small { display: block; font-size: 28px; font-weight: 400; color: #c3c9d4; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="despertar" data-width="1920" data-height="1080">
    <div id="dp-stage" class="clip" data-start="0" data-duration="9.5" data-track-index="0"></div>
    <div id="dp-preto" class="clip" data-start="0" data-duration="9.5" data-track-index="1"></div>
    <div id="dp-rotulo" class="clip" data-start="0" data-duration="9.5" data-track-index="2">CENA — O DESPERTAR<small>tela preta · "...pai? mãe?" · a câmera vira e revela os olhos · planos 12–16</small></div>
  </div>
  <script>
    (function () {
      const DUR = 8, CORTE = 3.8, REVELA = 5.4, MAOS = 6.0;
      // montagem: 5 s de preto só com a respiração; depois a cena aprovada em tempo real ("pai? mãe?" foi para o quarto, sentado)
      const PRETO = 5, TOTAL = 9.5;
      const LOOK = { grao: Pos.GRAO.baixo, fumaca: 0.15, dessat: 0.2 };   // padrão do modo cego
      const S = Cena.suave;
      const preto = document.getElementById("dp-preto");

      const sala = new THREE.Group();
      const Q = Cenarios.quarto(sala);
      const { k, X0, WZ0, WZ1, WY1, BX, BZ0, MT } = Q;

      // ---------- o Gabi deitado de costas, cabeça no travesseiro, coberto até o peito ----------
      const gabi = Elenco.build("gabi", { blind: true, expr: "neutro" });
      const HZ = BZ0 + 0.42, HY = 1.36;                       // centro da cabeça no travesseiro
      gabi.rotation.x = -Math.PI / 2;                           // deitado: cabeça para a cabeceira (-z), rosto para cima
      gabi.position.set(BX - 0.1, HY, HZ + Elenco.CABECA_Y);
      sala.add(gabi);
      const rg = gabi.userData.rig;
      // braços ao longo do corpo, por baixo do edredom
      rg.aL.sh.rotation.set(0, 0, -0.08); rg.aR.sh.rotation.set(0, 0, 0.08);
      // edredom puxado até o peito
      k.bolha(1.0, 0x5d7491, BX - 0.05, MT + 0.55, HZ + 1.75, [0.95, 0.5, 1.5], { r: [0.04, 0, 0] });
      k.bolha(0.6, 0x5d7491, BX - 0.1, MT + 0.82, HZ + 0.98, [1.35, 0.4, 0.5]);          // dobra na altura do peito
      sala.updateMatrixWorld(true);
      // mãos às têmporas, ao lado dos olhos (rosto, olhos e boca à mostra; cotovelo fora do corpo)
      const guarda = (b) => [b.sh.rotation.clone(), b.el.rotation.clone()];
      const repouso = [guarda(rg.aL), guarda(rg.aR)];
      Elenco.alcancar(gabi, "dir", rg.head.localToWorld(new THREE.Vector3(-0.42, -0.02, 0.2)), { foraDoCorpo: true });
      Elenco.alcancar(gabi, "esq", rg.head.localToWorld(new THREE.Vector3(0.43, -0.04, 0.18)), { foraDoCorpo: true });
      const olhos = [guarda(rg.aL), guarda(rg.aR)];
      const mistura = (b, A, B, u) => {
        b.sh.rotation.set(A[0].x + (B[0].x - A[0].x) * u, A[0].y + (B[0].y - A[0].y) * u, A[0].z + (B[0].z - A[0].z) * u);
        b.el.rotation.set(A[1].x + (B[1].x - A[1].x) * u, A[1].y + (B[1].y - A[1].y) * u, A[1].z + (B[1].z - A[1].z) * u);
      };

      // ---------- luz: o amanhecer pela janela (igual ao quarto aprovado) ----------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x12151c);
      scene.fog = new THREE.Fog(0x283044, 9, 24);
      scene.add(sala);
      scene.add(new THREE.HemisphereLight(0x95a7c8, 0x4a3e34, 3.1));
      const sol = new THREE.DirectionalLight(0xd8e2f2, 3.2);
      sol.position.set(X0 - 6, 6.2, -0.3); sol.target.position.set(-0.6, 0, -0.9);
      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006;
      Object.assign(sol.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 20 });
      scene.add(sol); scene.add(sol.target);
      const rosto = new THREE.PointLight(0xa9b8d6, 1.4, 4, 1.5); rosto.position.set(BX + 0.6, HY + 1.6, HZ + 0.6); scene.add(rosto);

      // câmera: começa de lado (vê o cabelo, a orelha) e gira por cima até ficar de frente para o rosto
      const cam = new THREE.PerspectiveCamera(32, 1920 / 1080, 0.05, 60);
      const alvo = new THREE.Vector3(BX - 0.1, HY, HZ);
      const renderer = Cena.renderer("dp-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };

      function render() {
        const tau = estado.t;
        const t = tau < PRETO ? CORTE * tau / PRETO : CORTE + (tau - PRETO);
        preto.style.opacity = t < CORTE ? 1 : 0;              // tela preta: só respiração e lençol (o som entra na pós)
        // respiração curta; a cabeça vira no travesseiro procurando o som
        const resp = Math.sin(t * 2 * Math.PI * 0.6) * 0.01;
        const procura = Math.sin(Math.max(0, t - CORTE) * 1.3) * 0.35 * (1 - S((t - MAOS) / 0.8));
        if (t > REVELA - 0.4 && rg.ficha.expr !== "medo") Elenco.expressao(gabi, "medo");
        Elenco.cabeca(gabi, -0.05, procura, 0, resp);
        const u = S((t - MAOS) / 0.9);
        mistura(rg.aL, repouso[0], olhos[0], u); mistura(rg.aR, repouso[1], olhos[1], S((t - MAOS - 0.15) / 0.9));
        Elenco.mao(gabi, "dir", "aberta", u); Elenco.mao(gabi, "esq", "aberta", u);
        // a câmera vira: de lado, por cima, até de frente para o rosto (o "up" gira junto)
        const g = S((t - CORTE) / (REVELA - CORTE + 0.6));
        const ang = (1 - g) * 1.35;                           // 1,35 rad: de lado · 0: de frente (por cima do rosto)
        const dist = 2.3 - 0.35 * g;
        cam.position.set(alvo.x + Math.sin(ang) * dist, alvo.y + Math.cos(ang) * dist, alvo.z + 0.55 + 0.25 * g);
        cam.up.set(0, Math.sin(ang * 0.9), -Math.cos(ang * 0.9)).normalize();
        cam.lookAt(alvo);
        // revelação: só o grão sobe (regra de pico)
        const pico = Math.max(0, 1 - Math.abs(t - REVELA) / 0.5);
        pos.render(scene, cam, t, { grao: LOOK.grao + 0.1 * pico, fumaca: LOOK.fumaca, dessat: LOOK.dessat });
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
      window.__timelines["despertar"] = tl;
      render();
    })();
  </script>
</template>
