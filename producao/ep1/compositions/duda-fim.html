<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dfi-stage { position: absolute; inset: 0; z-index: 0; }
    #dfi-stage canvas { display: block; }
    #dfi-preto { position: absolute; inset: 0; z-index: 2; background: #000; opacity: 0; pointer-events: none; }
  </style>
  <div id="root" data-composition-id="duda-fim" data-width="1920" data-height="1080">
    <div id="dfi-stage" class="clip" data-start="0" data-duration="4" data-track-index="0"><div id="dfi-preto"></div></div>
  </div>
  <script>
    (function () {
      // plano 75 (sem voz): o último plano da duda-levam (a Duda travada no portão) APAGA POR IGUAL — sem vinheta, ela
      // enxerga — de 0 a 1,8; depois só preto (o selo "DIA 1" fica na raiz, por cima). O último "Gabi!" (c10-mae-05c)
      // continua no preto e some em fade (na pós). ~1 s de preto e "DIA 1" antes do corte seco para a duda-van.
      const DUR = 4, CENA = "duda-fim", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "anoitecer" });
      const G = EP2.geo(W);
      G.portaoDuda(0);
      const duda = Elenco.build("duda", { expr: "medo", refinado: true, material: "pbr" }); W.scene.add(duda);
      duda.position.set(-6.6, 0, 6.3); duda.rotation.y = Math.PI;
      const pal = EP2.palco("dfi-stage");
      Elenco.ambiente(pal.renderer, W.scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 160);
      // o mesmo plano 74 da duda-levam (20-23), continuando o tempo de lá (t + 23): a câmera na mão e o push-in seguem
      // sem salto no corte entre as duas cenas
      const plano = { t0: 20, t1: 30, pos: V(-6.35, 2.0, 4.1), alvo: V(-6.6, 1.85, 6.3), fov: 36, mao: true };
      const preto = document.getElementById("dfi-preto");
      const estado = { t: 0 };
      function render() {
        const t = estado.t;
        preto.style.opacity = String(S(t / 1.8));
        if (t > 1.85) return;                                         // já é só preto
        W.scene.updateMatrixWorld(true);
        Elenco.alcancar(duda, "dir", V(-6.45, 1.17, 5.9), { foraDoCorpo: true });   // a mão continua na grade
        Elenco.mao(duda, "dir", "segura", 0.9);
        Elenco.cabeca(duda, -0.04, -0.45, 0);
        Elenco.vida(duda, t + 23, { ritmo: "tensao" });
        EP2.boca(duda, t, [], CENA);
        EP2.camera(cam, plano, t + 23);
        pal.render(W.scene, cam, t + 23);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
