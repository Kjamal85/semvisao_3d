<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dp-stage { position: absolute; inset: 0; z-index: 0; }
    #dp-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-portao" data-width="1920" data-height="1080">
    <div id="dp-stage" class="clip" data-start="0" data-duration="25" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 51-57 (fim de tarde), o payoff: 0-4 a mão sobe, hesita, desce · 4-6 sobe de novo e bate · 6-11 o rosto dela
      // (c09-duda-01, limpo) · 11-13,5 a cortina mexe, a porta abre uma fresta · 13,5-19,5 a mãe do Gabi na fresta
      // (c09-mae-03) · 19,5-22,5 a Duda faz que sim, sorriso pequeno · 22,5-25 olha a janela do quarto dele (plano 60 do EP1)
      const DUR = 25, CENA = "duda-portao", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "tarde" });
      const { scene, R } = W, G = EP2.geo(W);
      const RF = { refinado: true, material: "pbr" };
      const duda = Elenco.build("duda", Object.assign({ expr: "neutro" }, RF)); scene.add(duda);
      const mae = Elenco.build("mae", Object.assign({ expr: "ternura" }, RF)); scene.add(mae);
      const gP = G.gabiPortao;
      // a Duda na calçada, de frente para o portão (-z), a 0,55 do muro; a mãe dentro da porta, a ~3,3 dela
      duda.position.set(gP.x + 0.1, EP2.chao(gP.x + 0.1, gP.z + 0.55), gP.z + 0.55);   // na calçada (0,16) duda.rotation.y = Math.PI;
      mae.position.set(-1.0, 0, R.FZ + 0.32); mae.rotation.y = 0;   // no vão da porta, do lado da fechadura (a folha aberta não tapa o rosto), o corpo bloqueando a entrada
      // a cortina da sala (janela em x 1,3) por dentro: um pano que balança quando alguém espia
      const kc = Cena.kit(scene, 43), pano = new THREE.Group(); pano.position.set(1.3 - 0.35, 1.75, R.FZ - 0.06); scene.add(pano);
      kc.box(0.6, 0.95, 0.02, 0xd9c7a3, 0.3, 0, 0, { pai: pano, contorno: false });
      const pal = EP2.palco("dp-stage");
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 160);
      const D = duda.position;
      const planos = [
        { t0: 0, t1: 4, pos: V(D.x + 1.7, 1.8, D.z + 0.9), alvo: V(gP.x, 1.35, gP.z + 0.25), fov: 40 },
        { t0: 4, t1: 6, pos: V(D.x + 1.7, 1.8, D.z + 0.9), alvo: V(gP.x, 1.35, gP.z + 0.25), fov: 34 },
        { t0: 6, t1: 11, pos: V(D.x - 0.15, 2.1, gP.z - 1.15), alvo: V(D.x, 2.05, D.z), fov: 36 },
        { t0: 11, t1: 13.5, pos: V(D.x + 1.1, 2.0, D.z + 1.3), alvo: V(-0.2, 1.4, R.FZ), fov: 40 },
        { t0: 13.5, t1: 19.5, pos: V(D.x + 1.3, 2.12, D.z + 0.45), alvo: V(-1.0, 1.95, R.FZ + 0.3), fov: 24 },
        { t0: 19.5, t1: 22.5, pos: V(D.x - 0.15, 2.1, gP.z - 1.15), alvo: V(D.x, 2.05, D.z), fov: 36 },
        { t0: 22.5, t1: 25, pos: V(D.x - 1.4, 2.3, gP.z - 1.0), alvo: V(D.x, 2.05, D.z), fov: 40 },
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        scene.updateMatrixWorld(true);
        // a mão: sobe (0,8), hesita, desce (2,4); sobe de novo (4,2) e bate três vezes no portão (4,7-5,6)
        const sobe1 = S((t - 0.8) / 0.5) * (1 - S((t - 2.3) / 0.6)), sobe2 = S((t - 4.1) / 0.4) * (1 - S((t - 6.2) / 0.5));
        const bate = t > 4.7 && t < 5.7 ? Math.max(0, Math.sin((t - 4.7) * Math.PI * 3)) : 0;
        const alto = Math.max(sobe1 * 0.9, sobe2);
        if (alto > 0.02) {
          const alvo = V(gP.x + 0.12, 1.0 + 0.3 * alto, gP.z + 0.12 + 0.08 * (1 - alto) - 0.06 * bate);
          Elenco.alcancar(duda, "esq", alvo, { foraDoCorpo: true });
          Elenco.mao(duda, "esq", "punho", 0.8 * alto);
        }
        // olhar: o portão → a porta → a janela do quarto dele (último plano)
        const janela = S((t - 22.8) / 0.6);
        Elenco.cabeca(duda, 0.08 - 0.12 * janela, 0.55 * janela, 0.04 * janela);
        EP2.expr(duda, t < 19.5 ? "neutro" : t < 22.5 ? "ternura" : "triste");
        Elenco.vida(duda, t, { ritmo: "tensao", corpo: t > 6 });
        EP2.boca(duda, t, ["c09-duda-01"], CENA);
        // a cortina mexe (11,0-12,2) e a porta abre uma fresta (12,0-12,8); a mãe só aparece na fresta
        pano.rotation.y = 0.35 * Math.sin(Math.PI * Math.min(1, Math.max(0, (t - 11.0) / 1.2)));
        G.portaGabi(2.67 * S((t - 12.0) / 0.8) * (1 - S((t - 20.0) / 0.6)));   // abre 1,2 rad: a porta passa longe dela
        mae.visible = t > 12.2 && t < 20.4;
        Elenco.cabeca(mae, 0.04, -0.3, 0.05);   // o rosto para a Duda (à direita dela)
        Elenco.vida(mae, t, { ritmo: "tensao", fase: 3 });
        EP2.boca(mae, t, ["c09-mae-03"], CENA);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
