<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #ch-stage { position: absolute; inset: 0; z-index: 0; }
    #ch-stage canvas { display: block; }
    #ch-rotulo { position: absolute; left: 60px; bottom: 50px; z-index: 2; padding: 14px 22px;
      background: rgba(10, 12, 18, 0.72); color: #e9ecf2; font-family: sans-serif;
      font-size: 30px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; }
    #ch-rotulo small { display: block; font-size: 28px; font-weight: 400; color: #c3c9d4; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="chama" data-width="1920" data-height="1080">
    <div id="ch-stage" class="clip" data-start="0" data-duration="5.4" data-track-index="0"></div>
    <div id="ch-rotulo" class="clip" data-start="0" data-duration="5.4" data-track-index="1">C06 — A CHAMA<small>a mão chega perto da chama · "Cuidado, filho!" · encosta e puxa · plano 44</small></div>
    <audio id="ch-mae" class="clip" src="voz/audio/ep1/c06-mae-11.wav" data-start="2.0" data-duration="1.29" data-track-index="2" data-volume="1"></audio>
  </div>
  <script>
    (function () {
      const DUR = 3.4, CORTE = 1.4, TOTAL = 5.4;   // montagem: em DUR encosta na chama e puxa a mão (a mãe grita antes, de fora)
      const LOOK = { grao: Pos.GRAO.baixo, fumaca: 0.15, dessat: 0.2 };
      const S = Cena.suave, V = (x, y, z) => new THREE.Vector3(x, y, z);
      const guarda = (b) => [b.sh.rotation.clone(), b.el.rotation.clone()];
      const mistura = (b, A, B, u) => {
        b.sh.rotation.set(A[0].x + (B[0].x - A[0].x) * u, A[0].y + (B[0].y - A[0].y) * u, A[0].z + (B[0].z - A[0].z) * u);
        b.el.rotation.set(A[1].x + (B[1].x - A[1].x) * u, A[1].y + (B[1].y - A[1].y) * u, A[1].z + (B[1].z - A[1].z) * u);
      };
      const raiz = new THREE.Group();
      const K = Cenarios.cozinha(raiz);
      const { k, BZ, BH, FX } = K;
      // a boca da frente acesa: chama azul (cones aditivos que tremem)
      const QUEIMA = V(FX - 0.2, BH + 0.085, BZ + 0.19);
      const chamaMat = new THREE.MeshBasicMaterial({ color: 0x4a8cff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
      const pontaMat = new THREE.MeshBasicMaterial({ color: 0xbfe0ff, transparent: true, opacity: 0.7, blending: THREE.AdditiveBlending, depthWrite: false });
      const chamas = [];
      for (let i = 0; i < 14; i++) {
        const a = i / 14 * Math.PI * 2, c = new THREE.Mesh(new THREE.ConeGeometry(0.014, 0.07, 6), i % 2 ? chamaMat : pontaMat);
        c.position.set(QUEIMA.x + Math.cos(a) * 0.065, QUEIMA.y + 0.03, QUEIMA.z + Math.sin(a) * 0.065); c.userData.f = i * 1.7; raiz.add(c); chamas.push(c);
      }
      const brilho = new THREE.PointLight(0x5a8cff, 0.35, 0.9, 2); brilho.position.set(QUEIMA.x, QUEIMA.y + 0.1, QUEIMA.z); raiz.add(brilho);
      // o Gabi em frente ao fogão, tateando para baixo
      const gabi = Elenco.build("gabi", { blind: true, expr: "firme" });
      gabi.position.set(FX + 0.15, 0, BZ + 0.95); gabi.rotation.y = Math.PI + 0.25; raiz.add(gabi);
      const rg = gabi.userData.rig;
      Elenco.cabeca(gabi, 0.05, 0.45, 0.05);
      raiz.updateMatrixWorld(true);
      Elenco.alcancar(gabi, "esq", V(QUEIMA.x + 0.05, QUEIMA.y + 0.45, QUEIMA.z + 0.15), { foraDoCorpo: true }); const longe = guarda(rg.aR);
      Elenco.alcancar(gabi, "esq", V(QUEIMA.x + 0.02, QUEIMA.y + 0.17, QUEIMA.z + 0.02), { foraDoCorpo: true }); const perto = guarda(rg.aR);
      Elenco.alcancar(gabi, "esq", gabi.localToWorld(V(0.32, 1.45, 0.5)), { foraDoCorpo: true }); const puxa = guarda(rg.aR);   // a mão queimada volta para o peito
      Elenco.alcancar(gabi, "dir", V(FX + 0.65, BH + 0.06, BZ + 0.3), { foraDoCorpo: true });                         // a outra mão na bancada

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1d24);
      scene.fog = new THREE.Fog(0xd9cdb4, 12, 30);
      scene.add(raiz);
      scene.add(new THREE.HemisphereLight(0xe2d6be, 0x5a4c3e, 1.35));
      const sol = new THREE.DirectionalLight(0xffd6a0, 2.7);
      sol.position.set(1.6, 4.6, -9); sol.target.position.set(0.0, 0.6, 0.8);
      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.03;
      Object.assign(sol.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 25 });
      scene.add(sol); scene.add(sol.target);
      const rosto = new THREE.PointLight(0xe8dccb, 1.2, 3.5, 1.6); rosto.position.set(FX + 1.2, 2.3, BZ + 2.0); raiz.add(rosto);
      const cam = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.05, 60);
      const renderer = Cena.renderer("ch-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };

      function render() {
        const t = estado.t;
        for (const c of chamas) { const f = 1 + 0.25 * Math.sin(t * 23 + c.userData.f) + 0.15 * Math.sin(t * 37 + c.userData.f * 2); c.scale.set(1, f, 1); }
        brilho.intensity = 0.35 + 0.1 * Math.sin(t * 19);
        // a mão desce devagar, tateando no ar, em direção ao calor
        const desce = S((t - 0.3) / (DUR - 0.3)), dor = S((t - DUR) / 0.18);
        mistura(rg.aR, longe, perto, desce);
        if (dor > 0) mistura(rg.aR, perto, puxa, dor);
        rg.aR.sh.rotation.z += Math.sin(t * 3.1) * 0.03 + (dor > 0 ? Math.sin(t * 31) * 0.06 * (1 - S((t - DUR - 1.2) / 0.8)) : 0);
        Elenco.mao(gabi, "esq", dor > 0 ? "segura" : "aberta", 1);
        if (gabi.userData.rig.ficha.expr !== (dor > 0 ? "grito" : "firme")) Elenco.expressao(gabi, dor > 0 ? "grito" : "firme");
        Elenco.cabeca(gabi, 0.05 + 0.08 * desce - 0.2 * dor, 0.45 + 0.1 * dor, 0.05, Math.sin(t * 2 * Math.PI * 0.5) * 0.008);   // escuta de lado; na dor, a cabeça vai para trás
        if (t >= DUR) { cam.fov = 62; const sh = 0.03 * (1 - S((t - DUR) / 1.2)); cam.position.set(FX - 0.45 + Math.sin(t * 50) * sh, 2.3 + Math.sin(t * 41) * sh, BZ + 0.15); cam.lookAt(FX + 0.15, 2.05, BZ + 0.95); }   // de cima da bancada, de frente: o rosto na dor   // encostou: puxa a mão, dor
        else if (t < CORTE) { cam.fov = 58; cam.position.set(FX - 1.45, 2.05, BZ + 1.35); cam.lookAt(FX + 0.1, 1.55, BZ + 0.85); }   // de perfil: ele escuta de lado
        else { cam.fov = 36; const u = S((t - CORTE) / (DUR - CORTE)); cam.position.set(QUEIMA.x - 0.75 + 0.05 * u, QUEIMA.y + 0.42, QUEIMA.z + 0.62 - 0.06 * u); cam.lookAt(QUEIMA.x + 0.05, QUEIMA.y + 0.12, QUEIMA.z); }
        cam.updateProjectionMatrix();
        pos.render(scene, cam, t, LOOK);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
      window.__timelines["chama"] = tl;
      render();
    })();
  </script>
</template>
