<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dd-stage { position: absolute; inset: 0; z-index: 0; }
    #dd-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-despedida" data-width="1920" data-height="1080">
    <div id="dd-stage" class="clip" data-start="0" data-duration="29.5" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 27-33: 0-3 a mão da mãe procura a da filha · 3-5,2 olha o relógio de pulso · 5,2-7,5 já de pé, a bolsa
      // no ombro · 7,5-15 a mãe (ep2-maeduda-04) · 15-18 a Duda (ep2-duda-03) · 18-21,5 beijo na cabeça e vai para a
      // porta · 21,5-24 a porta da frente fecha · 24-29,5 a Duda sozinha, a TV baixinha
      // Regra: ninguém atravessa ninguém — a mãe contorna a mesa, a cadeira e a Duda (EP2.caminho).
      const DUR = 29.5, CENA = "duda-despedida", S = EP2.S, V = EP2.V;
      const W = EP2.mundo({ hora: "manha", dentro: true });
      const { scene, casa, C, M } = W;
      const R = { refinado: true, material: "pbr" };
      const maeS = Elenco.build("maeduda", Object.assign({ expr: "triste", pose: "sentado" }, R)); scene.add(maeS);
      const maeP = Elenco.build("maeduda", Object.assign({ expr: "firme" }, R)); scene.add(maeP);
      const duda = Elenco.build("duda", Object.assign({ expr: "triste", pose: "sentado" }, R)); scene.add(duda);
      EP2.senta(maeS, C.cadeiras[0], 1.03, casa); EP2.senta(duda, C.cadeiras[1], 0.92, casa);
      // a bolsa no ombro da mãe (de pé)
      const kc = Cena.kit(casa, 23), bolsa = new THREE.Group(); maeP.add(bolsa);
      kc.box(0.32, 0.36, 0.12, 0x6e4c37, 0, 0, 0, { pai: bolsa }); bolsa.position.set(0.34, 1.05, -0.02);
      const pal = EP2.palco("dd-stage");
      const tv = EP2.tv(pal.renderer);
      C.tv.material = tv.material;
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const MX = C.MX, MZ = C.MZ, MY = C.MY;
      // pontos da mãe de pé: ao lado da cadeira dela → atrás da Duda (beijo) → a porta (contornando a cadeira da Duda)
      const P_PE = M(1.15, 0, -1.0), P_BEIJO = M(MX - 0.75, 0, MZ + 0.95), P_PORTA = M(4.05, 0, -0.45), P_FORA = M(4.05, 0, 0.9);   // beijo: do lado esquerdo dela, a ~0,75
      const planos = [
        { t0: 0, t1: 3, pos: M(MX - 0.2, MY + 0.75, MZ - 0.35), alvo: M(MX - 0.25, MY + 0.02, MZ + 0.35), fov: 36 },
        { t0: 3, t1: 5.2, pos: M(2.95, 2.0, -2.9), alvo: M(1.6, 1.7, -1.95), fov: 44 },
        { t0: 5.2, t1: 7.5, pos: M(4.5, 2.3, -2.7), alvo: M(1.6, 1.6, -1.2), fov: 50 },
        { t0: 7.5, t1: 15, pos: M(3.2, 2.05, -2.85), alvo: M(1.3, 2.05, -1.05), fov: 42 },
        { t0: 15, t1: 18, pos: M(2.8, 2.05, -2.95), alvo: M(2.55, 1.95, -1.15), fov: 36 },
        { t0: 18, t1: 21.5, pos: M(2.15, 2.15, -3.0), alvo: M(2.15, 1.9, -1.0), fov: 46 },   // de lado para a linha mãe-Duda: as duas lado a lado
        { t0: 21.5, t1: 24, pos: M(4.6, 2.2, -2.5), alvo: M(4.05, 1.4, -0.1), fov: 48 },
        { t0: 24, t1: 29.5, pos: M(4.75, 2.45, -3.3), alvo: M(2.4, 1.5, -1.2), fov: 50 },
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        casa.updateMatrixWorld(true);
        const sentada = t < 5.2;
        maeS.visible = sentada; maeP.visible = !sentada && t < 23.4;
        // a mão da mãe vai até a da Duda (0,4-1,6) e fica; a Duda deixa a mão na mesa
        const maoDuda = M(MX - 0.12, MY + 0.04, MZ + 0.42);
        Elenco.alcancar(duda, "esq", maoDuda, { foraDoCorpo: true });
        if (sentada) {
          const vai = S((t - 0.4) / 1.2), solta = S((t - 2.9) / 0.4);
          const repouso = M(MX - 0.75, MY + 0.04, MZ + 0.1), sobre = maoDuda.clone().add(V(-0.06, 0.04, -0.03));
          Elenco.alcancar(maeS, "dir", repouso.clone().lerp(sobre, vai * (1 - solta)), { foraDoCorpo: true });
          // o relógio de pulso: levanta o braço esquerdo e olha (3,2-5)
          const pulso = S((t - 3.2) / 0.5);
          if (pulso > 0) Elenco.alcancar(maeS, "esq", maeS.localToWorld(V(0.05, 1.45 * pulso + 0.9 * (1 - pulso), 0.42)), { foraDoCorpo: true });
          Elenco.cabeca(maeS, 0.25 * pulso, 0, 0);
          Elenco.vida(maeS, t, { ritmo: "tensao", fase: 1 });
          EP2.boca(maeS, t, [], CENA);
        } else if (maeP.visible) {
          // de pé, fala; depois o caminho até a Duda (por trás da cadeira dela) e até a porta — sem atravessar ninguém
          let pos = P_PE.clone(), ry = EP2.olhaPara(P_PE, duda.position), andando = 0;
          if (t >= 17.8 && t < 19.6) { const c = EP2.caminho([P_PE, P_BEIJO], (t - 17.8) / 1.6); pos = c.pos; ry = c.ry; andando = 1; }
          else if (t >= 19.6 && t < 20.6) { pos = P_BEIJO.clone(); ry = EP2.olhaPara(P_BEIJO, duda.position); }
          // até a porta: contorna a cadeira da Duda pela frente, com folga
          else if (t >= 20.6) { const c = EP2.caminho([P_BEIJO, M(1.8, 0, -0.35), M(3.55, 0, -0.35), P_PORTA, P_FORA], (t - 20.6) / 2.8); pos = c.pos; ry = c.ry; andando = 1; }
          maeP.position.copy(pos); maeP.rotation.y = ry;
          EP2.anda(maeP, t, andando, 1.6);
          const beijo = t >= 19.6 && t < 20.6 ? S((t - 19.6) / 0.3) * (1 - S((t - 20.3) / 0.3)) : 0;
          Elenco.cabeca(maeP, 0.55 * beijo, 0, 0);
          Elenco.vida(maeP, t, { ritmo: "tensao", fase: 1, corpo: !andando });
          EP2.boca(maeP, t, ["ep2-maeduda-04"], CENA);
        }
        // a porta da frente abre quando a mãe chega (22,2) e fecha (23,4-24)
        C.abrePorta(S((t - 22.0) / 0.4) * (1 - S((t - 23.4) / 0.5)));
        // a Duda: olha para a mãe enquanto ela fala; responde; fica sozinha olhando a mesa
        const paraMae = t >= 5.2 && t < 21.5 ? 0.75 : 0;
        Elenco.cabeca(duda, t >= 24 ? 0.2 : 0.05, paraMae, 0);
        Elenco.vida(duda, t, { ritmo: t >= 24 ? "tensao" : "calmo", fase: 2 });
        EP2.boca(duda, t, ["ep2-duda-03"], CENA);
        tv.desenha(t, "estudio", "quarentena", false);
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
