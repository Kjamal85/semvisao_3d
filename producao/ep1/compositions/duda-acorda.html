<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #da-stage { position: absolute; inset: 0; z-index: 0; }
    #da-stage canvas { display: block; }
    #da-preto { position: absolute; inset: 0; background: #000; z-index: 3; }
  </style>
  <div id="root" data-composition-id="duda-acorda" data-width="1920" data-height="1080">
    <div id="da-stage" class="clip" data-start="0" data-duration="20" data-track-index="0"></div>
    <!-- plano 2: o preto, só a respiração (a isca: parece mais um cego acordando) -->
    <div id="da-preto" class="clip" data-start="0" data-duration="6.0" data-track-index="1"></div>
  </div>
  <script>
    (function () {
      // planos 2-5 (MONTAGEM_EP2.md): 0-5,5 preto · 5,5-8 a virada · 8-12 no travesseiro, pisca · 12-20 senta e espreguiça (narrador)
      const DUR = 20, CENA = "duda-acorda", S = EP2.S;
      const W = EP2.mundo({ hora: "manha", dentro: true });
      const { scene, casa, Q } = W;
      Q.cortina(1); Q.luzinhas(false);
      Q.cad.position.set(Q.EX - 0.5, 0, Q.EZ + 0.1); Q.cad.rotation.y = -Math.PI / 2;   // cadeira encostada na escrivaninha
      const R = { refinado: true, material: "pbr" };
      // deitada: o corpo do rig gira -90° em x (a cabeça vai para a cabeceira, -z local), o rosto para cima
      const deitada = Elenco.build("duda", Object.assign({ expr: "neutro" }, R));
      deitada.rotation.set(-Math.PI / 2, 0, 0); deitada.position.set(Q.BX, Q.MT + 0.16, -1.85); casa.add(deitada);
      // o edredom por cima dela (do peito aos pés): esconde o corpo deitado e os tênis
      const kc = Cena.kit(casa, 5), EDR = 0xd8cde8;
      kc.box(Q.BW + 0.12, 0.22, 2.05, EDR, Q.BX, Q.MT + 0.26, -2.35);
      kc.bolha(0.42, EDR, Q.BX - 0.2, Q.MT + 0.42, -3.05, [1.45, 0.42, 0.7], { r: [0, 0.2, 0] });
      kc.bolha(0.4, EDR, Q.BX + 0.25, Q.MT + 0.44, -2.0, [1.3, 0.45, 1.0], { r: [0, -0.3, 0] });
      // sentada na beira da cama, de frente para o quarto (+x local)
      const sentada = Elenco.build("duda", Object.assign({ expr: "neutro", pose: "sentado" }, R));
      sentada.position.set(Q.BX + Q.BW / 2 + 0.05, Q.MT + 0.1 - 1.075 * 0.92, -1.75); sentada.rotation.y = Math.PI / 4; casa.add(sentada);
      const pal = EP2.palco("da-stage");
      Elenco.ambiente(pal.renderer, scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 120);
      const M = W.M, rs = sentada.userData.rig;
      const ombro = [rs.aL.sh.rotation.clone(), rs.aR.sh.rotation.clone(), rs.aL.el.rotation.clone(), rs.aR.el.rotation.clone()];
      const planos = [
        { t0: 0, t1: 5.5, pos: M(Q.BX + 0.35, 1.75, -3.6), alvo: M(Q.BX + 0.35, 3.9, -3.3), fov: 50, push: 0 },
        // a virada: começa olhando o teto (a visão de quem acorda) e desce até os olhos dela
        { t0: 5.5, t1: 8.0, up: EP2.V(0, 0, 1), pos: M(Q.BX + 0.32, 1.7, -3.55),
          alvo: (t) => { const u = S((t - 5.9) / 0.9); return M(Q.BX + 0.35 - 0.3 * u, 3.9 - 2.85 * u, -3.3 - 0.62 * u); }, fov: 46, push: 0.004 },
        { t0: 8.0, t1: 12.0, pos: M(Q.BX + 0.85, 2.05, -3.15), alvo: M(Q.BX - 0.02, 1.02, -3.9), fov: 40 },
        { t0: 12.0, t1: 20, pos: M(0.35, 1.9, -0.2), alvo: M(-0.7, 1.55, -1.85), fov: 62 },
      ];
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        const deitado = t < 12;
        deitada.visible = deitado; sentada.visible = !deitado;
        if (deitado) {
          // os olhos fechados até a virada; abrem devagar (focando) e piscam com a claridade
          const abre = S((t - 6.3) / 0.9);
          Elenco.vida(deitada, t, { ritmo: "calmo", corpo: false, olhar: t > 8, piscar: t > 7.4 });
          for (const o of deitada.userData.rosto.olhos) o.scale.y *= 0.08 + 0.92 * abre;
        } else {
          // espreguiça: os braços sobem com peso (mola) e voltam
          const sobe = Elenco.mola([[0, 0], [13.2, 1], [16.4, 0]], t, { freq: 1.0, amort: 0.8 });
          // os braços abrem para os LADOS e sobem (nunca passam na frente do rosto)
          rs.aL.sh.rotation.set(ombro[0].x - 0.2 * sobe, ombro[0].y, ombro[0].z - 2.5 * sobe);
          rs.aR.sh.rotation.set(ombro[1].x - 0.2 * sobe, ombro[1].y, ombro[1].z + 2.5 * sobe);
          rs.aL.el.rotation.set(ombro[2].x - 0.4 * sobe, 0, 0); rs.aR.el.rotation.set(ombro[3].x - 0.4 * sobe, 0, 0);
          Elenco.cabeca(sentada, -0.12 * sobe, 0, 0);
          Elenco.vida(sentada, t, { ritmo: "calmo", fase: 1 });
        }
        EP2.camera(cam, p, t);
        pal.render(scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      tl.fromTo("#da-preto", { opacity: 1 }, { opacity: 0, duration: 0.45, ease: "power1.out" }, 5.5);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
