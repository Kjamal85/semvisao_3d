      bolha(0.3, 0x34597a, 0, 0.6, 0.06, [1.02, 0.4, 0.48], { pai: moc, r: [0.25, 0, 0] });         // aba
      box(0.4, 0.3, 0.08, 0x34597a, 0, 0.26, 0.18, { pai: moc });                                  // bolso
      for (const s of [-1, 1]) box(0.06, 0.55, 0.04, 0x22262f, s * 0.18, 0.45, -0.17, { pai: moc, contorno: false });
      const cam1 = new THREE.Group(); cam1.position.set(1.45, 0.02, 0.35); cam1.rotation.y = 0.6; sala.add(cam1);
      box(0.52, 0.03, 0.6, 0x8a9bb0, 0, 0.015, 0, { pai: cam1 });                                     // tronco
      box(0.3, 0.03, 0.2, 0x8a9bb0, -0.36, 0.015, -0.2, { pai: cam1, r: [0, 0.6, 0] });               // manga
      box(0.3, 0.03, 0.2, 0x8a9bb0, 0.33, 0.015, -0.12, { pai: cam1, r: [0, -0.3, 0] });              // manga
      bolha(0.18, 0x8a9bb0, 0.05, 0.04, 0.1, [1.4, 0.25, 1.0], { pai: cam1 });                        // amassado
      box(0.18, 0.031, 0.06, 0x2a3140, 0, 0.032, -0.27, { pai: cam1, contorno: false });              // gola
      // guarda-roupa na parede da janela, perto da câmera
      box(0.75, 3.2, 1.6, 0x7d5d44, X0 + 0.4, 1.6, 1.65);
      box(0.02, 3.0, 0.02, 0x3a271c, X0 + 0.785, 1.6, 1.65, { contorno: false });
      for (const s of [-1, 1]) box(0.04, 0.3, 0.04, 0xc9a86a, X0 + 0.8, 1.6, 1.65 + s * 0.1, { contorno: false });

      // ---------- Gabi: acordou cego, sentado na cama, tateando o ar ----------
      const gabi = Elenco.build("gabi", { blind: true, expr: "medo", pose: "sentado_cama", fone: null });
      gabi.position.set(BX - 0.1, MT + 0.12 - 1.075, BZ0 + 0.75);
      sala.add(gabi);
      const rig = gabi.userData.rig;

      // ---------- luz: só o amanhecer entrando pela janela ----------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x12151c);
      scene.fog = new THREE.Fog(0x283044, 9, 24);                    // profundidade: o fundo esfria e some
      scene.add(sala);
      scene.add(new THREE.HemisphereLight(0x95a7c8, 0x4a3e34, 3.1));
      const sol = new THREE.DirectionalLight(0xd8e2f2, 3.2);         // luz da janela, fria
      sol.position.set(X0 - 6, 6.2, -0.3); sol.target.position.set(-0.6, 0, -0.9);
      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006;
      Object.assign(sol.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 20 });
      scene.add(sol); scene.add(sol.target);
      const rebote = new THREE.PointLight(0x8a7a66, 0.6, 9, 2);       // rebote quente do piso iluminado
      rebote.position.set(-1.2, 0.6, -0.4); scene.add(rebote);
      // preenchimento frio e fraco no rosto (céu rebatendo): o rosto é o foco, mesmo no escuro
      const preench = new THREE.SpotLight(0xa9b8d6, 2.2, 7, 0.32, 0.8, 1.5);
      preench.position.set(0.9, 2.7, 1.4); preench.target.position.set(-1.7, 1.95, -1.75);
      scene.add(preench); scene.add(preench.target);
      // feixe de luz no ar (volume falso) e poeira flutuando dentro dele
      const poeiraMat = new THREE.MeshBasicMaterial({ color: 0xe8eef7, transparent: true, opacity: 0.32, fog: false, depthWrite: false });
      const poeira = [];
      for (let i = 0; i < 45; i++) {
        // dentro do feixe: desce da janela em diagonal (~0,72 de queda por unidade em x)
        const dx = rnd() * 2.6, y = WY1 - 0.2 - dx * 0.72 - rnd() * 1.4;
        const p = new THREE.Mesh(new THREE.SphereGeometry(0.006 + rnd() * 0.007, 6, 4), poeiraMat);
        p.userData.base = [X0 + 0.3 + dx, Math.max(0.9, y), WZ0 + 0.1 + rnd() * (WZ1 - WZ0 - 0.2), rnd() * 6.28];
        scene.add(p); poeira.push(p);
      }

      // ---------- câmera: entra devagar no quarto (empurrão suave, sem tranco) ----------
      const cam = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.8, 30);   // near maior: sem cintilação no cabelo (z-fighting) no plano aberto
      const CAM_A = [4.6, 2.35, 5.4], CAM_B = [3.4, 2.05, 3.7], ALVO = [-0.9, 1.35, -1.35];

      const renderer = Cena.renderer("q-stage");   // mesmo ajuste de antes (1920x1080, sombras suaves), renderer compartilhado
      const pos = Pos.criar(renderer, 1920, 1080);

      const estado = { t: 0 };
      const ease = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));  // sine in-out
      // close: de frente para o rosto (3/4 para o lado da câmera do plano aberto)
      sala.updateMatrixWorld(true);
      const hw = rig.head.getWorldPosition(new THREE.Vector3());
      const fwd = new THREE.Vector3(0, 0, 1).applyQuaternion(gabi.getWorldQuaternion(new THREE.Quaternion())).setY(0).normalize();
      const lado = new THREE.Vector3(CAM_B[0] - hw.x, 0, CAM_B[2] - hw.z).normalize();
      const dirC = fwd.clone().multiplyScalar(0.55).add(lado.multiplyScalar(0.45)).normalize();
      const camC = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.4, 30);
      const bocas = gabi.userData.rosto.bocas, boca0 = Elenco.EXPR.medo.boca;
      function render() {
        const tt = estado.t, t = tt < CLOSE ? tt : tt - CLOSE, u = ease(t / (TOTAL - CLOSE));
        let camR = cam;
        if (tt < CLOSE) {
          const c = ease(tt / CLOSE);
          camC.position.set(hw.x + dirC.x * (3.4 - 0.3 * c), hw.y + 0.05, hw.z + dirC.z * (3.4 - 0.3 * c));
          camC.lookAt(hw.x, hw.y - 0.3, hw.z); camR = camC;
        } else {
          cam.position.set(CAM_A[0] + (CAM_B[0] - CAM_A[0]) * u, CAM_A[1] + (CAM_B[1] - CAM_A[1]) * u, CAM_A[2] + (CAM_B[2] - CAM_A[2]) * u);
          cam.lookAt(ALVO[0], ALVO[1], ALVO[2]);
        }
        // boca: ofegante no close (abre a cada respiração) e mexendo na fala
        const falaG = tt > FALA[0] && tt < FALA[1] && Math.sin(tt * 15) + Math.sin(tt * 5.9) > 0.1;
        const arfa = tt < CLOSE + 1 && !(tt > FALA[0] - 0.2 && tt < FALA[1] + 0.2) && Math.sin(tt * 2 * Math.PI * 0.9) > 0.3;
        for (const n in bocas) bocas[n].visible = n === (falaG || arfa ? "o" : boca0);
        // vida: respiração curta (assustado), a cabeça procura o som com atraso em relação aos braços
        const resp = Math.sin(t * 2 * Math.PI * 0.55);
        rig.head.position.y = Elenco.CABECA_Y + resp * 0.012;
        rig.head.rotation.y = Math.sin(t * 0.9) * 0.35 + Math.sin(t * 2.3 + 1) * 0.06;
        rig.head.rotation.z = Math.sin(t * 0.9 - 0.6) * 0.06;
        rig.aL.sh.rotation.x = -1.05 + Math.sin(t * 1.1 + 0.4) * 0.12;
        rig.aL.sh.rotation.z = 0.12 + Math.sin(t * 0.7 + 1.2) * 0.1;
        rig.aR.sh.rotation.x = -0.8 + Math.sin(t * 0.95 + 2.1) * 0.15;
        rig.aR.el.rotation.x = -0.55 + Math.sin(t * 1.3 + 0.8) * 0.12;
        for (const p of poeira) {
          const b = p.userData.base;
          p.position.set(b[0] + Math.sin(t * 0.3 + b[3]) * 0.08, b[1] + Math.sin(t * 0.21 + b[3] * 1.7) * 0.06 + t * 0.01, b[2] + Math.cos(t * 0.25 + b[3]) * 0.07);
        }
        const aceso = (t % 1) < 0.55; visor.visible = aceso; brilhoR.intensity = aceso ? 0.35 : 0;   // pisca 1x por segundo
        pos.render(scene, camR, tt, LOOK);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
      window.__timelines["quarto"] = tl;
      render();
    })();
  </script>
</template>
