<template>
  <style>
    #root { position: absolute; inset: 0; background: #0d1018; }
    #ov-stage { position: absolute; inset: 0; z-index: 0; }
    #ov-stage canvas { display: block; }
    #ov-rotulo { position: absolute; left: 60px; bottom: 50px; z-index: 2; padding: 14px 22px;
      background: rgba(10, 12, 18, 0.72); color: #e9ecf2; font-family: sans-serif;
      font-size: 30px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; }
    #ov-rotulo small { display: block; font-size: 28px; font-weight: 400; color: #c3c9d4; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="ouviu" data-width="1920" data-height="1080">
    <div id="ov-stage" class="clip" data-start="0" data-duration="13" data-track-index="0"></div>
    <div id="ov-rotulo" class="clip" data-start="0" data-duration="13" data-track-index="1">C09 — ELE OUVIU TUDO<small>uma lágrima · a vergonha · a mãe senta ao lado · plano 61</small></div>
  </div>
  <script>
    (function () {
      const DUR = 13, C1 = 3.0, ABR = 5.6, C2 = 8.6;                     // montagem: o ABRAÇO longo (ABR) e um plano mais perto (C2)                                          // close do Gabi · a mãe senta ao lado
      const LOOK = { grao: Pos.GRAO.baixo, fumaca: 0.15, dessat: 0.2 };   // padrão do modo cego
      const FECHA = 0.09;                                               // "a vinheta fecha um pouco"
      const S = Cena.suave, V = (x, y, z) => new THREE.Vector3(x, y, z), E = (x, y, z) => new THREE.Euler(x, y, z);
      const expr = (g, n) => { if (g.userData.rig.ficha.expr !== n) Elenco.expressao(g, n); };
      const guarda = (b) => [b.sh.rotation.clone(), b.el.rotation.clone()];
      const mistura = (b, A, B, u) => {
        b.sh.rotation.set(A[0].x + (B[0].x - A[0].x) * u, A[0].y + (B[0].y - A[0].y) * u, A[0].z + (B[0].z - A[0].z) * u);
        b.el.rotation.set(A[1].x + (B[1].x - A[1].x) * u, A[1].y + (B[1].y - A[1].y) * u, A[1].z + (B[1].z - A[1].z) * u);
      };

      // ======================= a sala da frente, logo depois que a Duda foi embora =======================
      const sala = new THREE.Group();
      const F = Cenarios.frente(sala);
      const { k, SX, SZ, SEAT } = F;
      const Y_SENT = SEAT + 0.1 - 1.075;

      // o Gabi no mesmo lugar do portão; a mão esquerda (enfaixada) ainda agarrada no peito
      const gabi = Elenco.build("gabi", { blind: true, expr: "choro", pose: "sentado" });
      const GRY = -Math.PI / 2 - 0.25;
      gabi.position.set(SX - 0.05, Y_SENT, SZ - 0.55); gabi.rotation.y = GRY; sala.add(gabi);
      const rg = gabi.userData.rig;
      const gaze = new THREE.MeshToonMaterial({ color: 0xf6f3ea, gradientMap: k.grad });
      const fx = new THREE.Mesh(new THREE.CylinderGeometry(0.082, 0.082, 0.15, 16), gaze); fx.position.set(0, -0.06, 0); fx.scale.set(1.1, 1.1, 1.1); rg.aR.mao.g.add(fx);
      sala.updateMatrixWorld(true);
      const gp = (x, y, z) => gabi.localToWorld(V(x, y, z));
      Elenco.alcancar(gabi, "esq", gp(0.08, 1.12, 0.55)); const esqColo = guarda(rg.aR);
      Elenco.alcancar(gabi, "dir", gp(-0.08, 1.1, 0.58)); const dirColo = guarda(rg.aL);
      const esqPeito = [E(-0.6, -0.5, 0.12), E(-2.65, 0, 0)];          // a pose de apertar do portão

      // a mãe: fechou a porta; atravessa a sala e senta do lado esquerdo dele (+z)
      const mae = Elenco.build("mae", { expr: "triste" }); sala.add(mae);
      const rm = mae.userData.rig;
      const MRY = -Math.PI / 2 - 0.3;                                    // sentada: de frente para a câmera, um pouco virada para ele
      const M_SENT = V(SX - 0.05, Y_SENT, SZ + 0.25), M_PE = V(SX - 0.6, 0, SZ + 0.25);
      const P0 = V(0.9, 0, 0.9), PC = V(0.15, 0, 2.75);                 // da porta, por fora dos pés dele
      // pose final (sentada) para calcular a mão no ombro dele
      mae.position.copy(M_SENT); mae.rotation.y = MRY;
      for (const l of [rm.pL, rm.pR]) { l.hip.rotation.x = -Math.PI / 2; l.knee.rotation.x = Math.PI / 2; }
      sala.updateMatrixWorld(true);
      const maeSolta = [E(-0.15, 0, -0.08), E(-0.3, 0, 0)];
      Elenco.alcancar(mae, "dir", gp(0.33, 1.7, -0.12), { foraDoCorpo: true }); const maeOmbro = guarda(rm.aL);
      const maeColo = [E(-0.45, 0, 0.1), E(-1.0, 0, 0)];
      // o abraço: um braço por trás das costas até o ombro de lá, o outro no braço dele
      Elenco.alcancar(mae, "dir", gp(-0.3, 1.78, -0.12), { foraDoCorpo: true }); const maeAbraca = guarda(rm.aL);
      Elenco.alcancar(mae, "esq", gp(0.22, 1.35, 0.35), { foraDoCorpo: true }); const maeAbracaE = guarda(rm.aR);
      const camC = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 60);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1d24);
      scene.fog = new THREE.Fog(0x4a4640, 9, 22);
      scene.add(sala); scene.add(F.luzes);
      F.rosto.position.set(SX - 1.65, 1.45, SZ - 0.65); F.rosto.intensity = 1.9;
      F.luzes.children[0].intensity = 2.5;                                    // ambiente um pouco acima do portão: a vinheta fechando come luz   // longe do caminho da mãe (a cabeça dela estourava)

      const camA = new THREE.PerspectiveCamera(32, 1920 / 1080, 0.1, 60);
      const camB = new THREE.PerspectiveCamera(36, 1920 / 1080, 0.1, 60);
      const renderer = Cena.renderer("ov-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };

      function render() {
        const t = estado.t;
        F.cortina.material.uniforms.onda.value = t * 1.3;
        F.poeira(t);
        F.porta.rotation.y = 0;                                         // a porta já fechou (o clique é o corte)

        // ---- o Gabi ----
        mistura(rg.aR, esqPeito, esqColo, S((t - 1.3) / 1.3));          // a mão solta o peito e cai no colo
        mistura(rg.aL, dirColo, dirColo, 0);
        Elenco.mao(gabi, "esq", "punho", 1 - S((t - 1.6) / 0.8));
        Elenco.mao(gabi, "dir", "segura", 0.4 + 0.5 * S((t - 4.2) / 0.4)); // aperta o joelho quando ela encosta
        const soluco = Math.max(0, Math.sin((t - 0.4) * 2 * Math.PI * 0.9)) * (t > 0.4 && t < 2.6 ? 0.012 : 0.004);
        const foge = S((t - 4.1) / 0.5);                                // vergonha: vira o rosto para longe dela
        Elenco.cabeca(gabi, 0.16 + 0.06 * S((t - 0.8) / 1.5) + 0.04 * foge, -0.12 + 0.1 * S((t - C1) / 0.2) - 0.05 * foge, -0.06 - 0.08 * foge, Math.sin(t * 2 * Math.PI * 0.35) * 0.006 + soluco);
        expr(gabi, t < 4.2 ? "choro" : "triste");
        Elenco.lagrimas(gabi, S((t - 0.5) / 0.9), t);                    // uma lágrima: só o lado da câmera
        for (const l of rg.lagrimas) if (l.side < 0) { l.gota.visible = false; l.trilha.visible = false; }

        // ---- a mãe: atravessa durante o close (1,9-3,4), vira de costas para o sofá, senta (3,4-4,1), a mão no ombro dele (4,1-4,7) ----
        const anda = S((t - 1.9) / 1.5), u = Math.min(1, Math.max(0, (t - 1.9) / 1.5));
        const a = 1 - anda;                                             // curva de Bézier: porta → por fora dos pés → em pé na frente do lugar
        const p = V(a * a * P0.x + 2 * a * anda * PC.x + anda * anda * M_PE.x, 0, a * a * P0.z + 2 * a * anda * PC.z + anda * anda * M_PE.z);
        const dx = 2 * a * (PC.x - P0.x) + 2 * anda * (M_PE.x - PC.x), dz = 2 * a * (PC.z - P0.z) + 2 * anda * (M_PE.z - PC.z);
        const ryAnda = Math.atan2(dx, dz), vira = S((t - 3.1) / 0.4);
        const senta = S((t - 3.4) / 0.7);
        mae.position.set(p.x + (M_SENT.x - p.x) * senta, Y_SENT * senta, p.z + (M_SENT.z - p.z) * senta);
        mae.rotation.y = ryAnda + (MRY - ryAnda) * vira;
        const passo = Math.sin(t * 9) * 0.42 * (u > 0 && u < 0.92 ? 1 : 0) * (1 - vira);
        rm.pL.hip.rotation.x = passo - Math.PI / 2 * senta; rm.pR.hip.rotation.x = -passo - Math.PI / 2 * senta;
        rm.pL.knee.rotation.x = Math.max(0, -passo) * 0.8 + Math.PI / 2 * senta; rm.pR.knee.rotation.x = Math.max(0, passo) * 0.8 + Math.PI / 2 * senta;
        mistura(rm.aL, [E(passo * 0.5, 0, -0.08), maeSolta[1]], maeOmbro, S((t - 4.1) / 0.6));
        mistura(rm.aR, [E(-passo * 0.5, 0, 0.08), maeSolta[1]], maeColo, senta);
        Elenco.mao(mae, "dir", "aberta", S((t - 4.1) / 0.6) * 0.6);
        expr(mae, "triste");
        Elenco.cabeca(mae, 0.1 + 0.08 * senta, -0.25 * S((t - 3.9) / 0.6), -0.12 * S((t - 4.4) / 0.6), Math.sin(t * 2 * Math.PI * 0.3) * 0.008);
        // ---- o abraço: ela puxa o filho; ele vira para ela e chora; ela chora junto ----
        const abr = S((t - ABR) / 0.8);
        if (abr > 0) { mistura(rm.aL, maeOmbro, maeAbraca, abr); mistura(rm.aR, maeColo, maeAbracaE, abr); Elenco.mao(mae, "dir", "aberta", 0.6); }
        mae.position.z -= 0.12 * abr;
        if (t > ABR) {
          expr(gabi, "choro"); expr(mae, "choro");
          Elenco.cabeca(gabi, 0.2, -0.17 + 0.42 * abr, -0.14 + 0.1 * abr, Math.sin(t * 2 * Math.PI * 0.35) * 0.006 + Math.max(0, Math.sin(t * 2 * Math.PI * 0.8)) * 0.01);
          Elenco.cabeca(mae, 0.18, -0.25 - 0.15 * abr, -0.12, Math.sin(t * 2 * Math.PI * 0.3) * 0.008);
          Elenco.lagrimas(mae, S((t - ABR - 1.0) / 0.8), t);
        }
        mae.visible = t >= C1;

        let cam;
        if (t < C1) {
          const v = S(t / C1);                                          // close 3/4 do lado da lágrima, empurrando devagar
          camA.position.set(-0.7 + 0.3 * v, 1.85, 1.75); camA.lookAt(2.2, 1.45, 1.9); cam = camA;
        } else if (t >= C2) {
          const v = S((t - C2) / (DUR - C2));                            // mais perto: os dois rostos, abraçados
          const foco = V(SX - 0.05, 1.5, SZ + 0.22); camC.position.set(-2.3, 1.55, 2.05).lerp(foco, 0.42 + 0.06 * v); camC.lookAt(foco); cam = camC;
        } else {
          const v = S((t - C1) / (C2 - C1));
          camB.position.set(-2.3 + 0.25 * v, 1.8, 2.05); camB.lookAt(2.1, 1.25, 2.2); cam = camB;
        }
        const f = LOOK.fumaca + FECHA * S((t - 0.6) / 2.2);
        pos.render(scene, cam, t, { grao: LOOK.grao, fumaca: f, dessat: LOOK.dessat });
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines["ouviu"] = tl;
      render();
    })();
  </script>
</template>
