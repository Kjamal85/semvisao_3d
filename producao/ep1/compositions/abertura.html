<template>
  <style>
    #root { position: absolute; inset: 0; background: #05070c; }
    #ab-stage { position: absolute; inset: 0; z-index: 0; }
    #ab-stage canvas { display: block; }
    #ab-selo { position: absolute; left: 60px; top: 50px; z-index: 3; padding: 12px 20px;
      background: rgba(8, 10, 16, 0.6); color: #f2f4f8; font-family: "Arial Black", Arial, sans-serif;
      font-size: 34px; font-weight: 900; letter-spacing: .04em; border-radius: 6px; }
    #ab-selo small { display: block; font-family: Arial, sans-serif; font-size: 22px; font-weight: 700; color: #b8c0cc; letter-spacing: .12em; }
    #ab-flash { position: absolute; inset: 0; z-index: 4; background: #ffffff; opacity: 0; }
    #ab-rotulo { position: absolute; left: 60px; bottom: 50px; z-index: 2; padding: 14px 22px;
      background: rgba(10, 12, 18, 0.72); color: #e9ecf2; font-family: sans-serif;
      font-size: 30px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; }
    #ab-rotulo small { display: block; font-size: 28px; font-weight: 400; color: #c3c9d4; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="abertura" data-width="1920" data-height="1080">
    <div id="ab-stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
    <div id="ab-selo" class="clip" data-start="0" data-duration="12" data-track-index="1"><small>SÃO PAULO · 17 NOV</small><span id="ab-hora">23:30</span></div>
    <div id="ab-flash" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
    <div id="ab-rotulo" class="clip" data-start="0" data-duration="12" data-track-index="3">CENÁRIO 9 — ABERTURA<small>23:30 → 03:30 · flash · onda · São Paulo → Brasil → globo · planos 1–11</small></div>
  </div>
  <script>
    (function () {
      const DUR = 12, LAPSO = 5.0, FLASH = 5.0, ONDA0 = 5.3, ONDA1 = 8.0, GLOBO = 8.0;
      const LOOK = { grao: 0, fumaca: 0, dessat: 0 };   // antes do evento: SEM filtro (usuário: filtro só na parte do Gabi cego)
      const S = Cena.suave;
      const horaEl = document.getElementById("ab-hora"), flashEl = document.getElementById("ab-flash");

      // ======================= CIDADE (São Paulo à noite, vista de cima) =======================
      const cidade = new THREE.Group();
      const k = Cena.kit(cidade, 1117);
      const { rnd } = k;
      const QUADRA = 8, RUA = 3, N = 13, PASSO = QUADRA + RUA, EXT = N * PASSO;
      k.box(EXT * 2 + 60, 0.2, EXT * 2 + 60, 0x161a22, 0, -0.1, 0, { contorno: false, sombra: false });   // chão / ruas
      // janelas: texturas com janelas acesas (amarelas) e o resto transparente; 3 alturas x 3 padrões
      function texJanelas(linhas, seed) {
        const r = Cena.prng(seed), cv = document.createElement("canvas"); cv.width = 40; cv.height = linhas * 8;
        const g = cv.getContext("2d");
        for (let y = 0; y < linhas; y++) for (let x = 0; x < 5; x++) {
          const v = r();
          if (v < 0.55) { g.fillStyle = v < 0.08 ? "#bfe0ff" : (v < 0.4 ? "#ffd27a" : "#ffb85c"); g.fillRect(x * 8 + 2, y * 8 + 2, 4, 4); }
        }
        const t = new THREE.CanvasTexture(cv); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.LinearFilter; t.colorSpace = THREE.SRGBColorSpace;
        return t;
      }
      const nada = new THREE.MeshBasicMaterial({ visible: false });
      const MJ = [];
      for (const [cls, linhas] of [[0, 6], [1, 14], [2, 28]]) for (let p = 0; p < 3; p++) {
        const m = new THREE.MeshBasicMaterial({ map: texJanelas(linhas, 50 + cls * 7 + p), transparent: true, alphaTest: 0.5, fog: true });
        MJ.push([m, m, nada, nada, m, m]);
      }
      const CORES = [0x4f586e, 0x5c6274, 0x48506a, 0x66606c, 0x434b5e];
      const predios = [];
      const centro = (i) => -EXT / 2 + i * PASSO + PASSO / 2;
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const cx = centro(i), cz = centro(j);
        const dc = Math.hypot(cx, cz + 10) / (EXT / 2);
        const n = 1 + Math.floor(rnd() * 4);
        for (let b = 0; b < n; b++) {
          const w = 2.2 + rnd() * 2.6, d = 2.2 + rnd() * 2.6;
          const x = cx + (rnd() - 0.5) * (QUADRA - w), z = cz + (rnd() - 0.5) * (QUADRA - d);
          const alto = rnd() < 0.25 * (1.2 - dc);
          const h = alto ? 18 + rnd() * 16 : 3 + rnd() * 9;
          const cls = h < 8 ? 0 : (h < 18 ? 1 : 2);
          const perto = Math.hypot(x, z - 20) < 45;
          const m = k.box(w, h, d, CORES[Math.floor(rnd() * CORES.length)], x, h / 2, z, { contorno: perto, sombra: false });
          const jan = new THREE.Mesh(m.geometry, MJ[cls * 3 + Math.floor(rnd() * 3)]); jan.scale.set(1.01, 1.0, 1.01); m.add(jan);
          if (alto && rnd() < 0.5) { const luz = k.box(0.25, 0.25, 0.25, 0, 0, h / 2 + 0.3, 0, { mat: new THREE.MeshBasicMaterial({ color: 0xff3030 }), contorno: false, sombra: false, pai: m }); luz.userData.pisca = rnd(); predios.push({ jan: luz, x, z, apaga: 2 }); }
          predios.push({ jan, x, z, apaga: 0.15 + rnd() * 1.4 });   // apaga = fração do lapso em que a janela se apaga (>1 = fica acesa até a onda)
        }
      }
      // postes ao longo das ruas + carros nas avenidas: pontos com shader (apagam no lapso e na passagem da onda)
      const ORIGEM = new THREE.Vector3(10, 0, -170);
      const vert = `
        attribute float apaga; uniform float lapso, raio; uniform vec3 origem; uniform float tam;
        varying float vVivo;
        void main() {
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          float vivo = step(lapso, apaga) * step(raio, distance(position.xz, origem.xz));
          vVivo = vivo;
          gl_PointSize = vivo * tam * (300.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }`;
      const frag = `
        uniform vec3 cor; varying float vVivo;
        void main() { if (vVivo < 0.5) discard; vec2 c = gl_PointCoord - 0.5; if (dot(c, c) > 0.25) discard; gl_FragColor = vec4(cor, 1.0); }`;
      const pontos = (posArr, apagaArr, cor, tam) => {
        const geo = new THREE.BufferGeometry();
        geo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(posArr), 3));
        geo.setAttribute("apaga", new THREE.BufferAttribute(new Float32Array(apagaArr), 1));
        const mat = new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag,
          uniforms: { lapso: { value: 0 }, raio: { value: -1 }, origem: { value: ORIGEM }, tam: { value: tam }, cor: { value: new THREE.Color(cor) } } });
        const p = new THREE.Points(geo, mat); p.frustumCulled = false; cidade.add(p); return { p, mat, geo };
      };
      const pp = [], pa = [];
      for (let i = 0; i <= N; i++) for (let s = -EXT / 2; s <= EXT / 2; s += 3.2) {
        const r = -EXT / 2 + i * PASSO;
        pp.push(r + 0.6, 0.6, s, s, 0.6, r + 0.6); pa.push(1.1 + rnd(), 1.1 + rnd());   // postes ficam acesos até a onda
      }
      const postes = pontos(pp, pa, 0xffb050, 0.5);
      const CARROS = 70, cp = new Float32Array(CARROS * 3), ca = [], cdat = [];
      for (let i = 0; i < CARROS; i++) { cdat.push({ av: Math.floor(rnd() * 5) * 3 - 1, eixo: rnd() < 0.5, v: (rnd() < 0.5 ? 1 : -1) * (4 + rnd() * 5), o: rnd() * EXT }); ca.push(5); }
      const farois = pontos(Array.from(cp), ca, 0xfff4dc, 0.7);
      // a onda: anel no chão + parede de energia (aditivos), saindo do horizonte
      const ondaMat = new THREE.MeshBasicMaterial({ color: 0x9fe6ff, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
      const ondaMat2 = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending,
        uniforms: { op: { value: 0 } },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
        fragmentShader: `uniform float op; varying vec2 vUv; void main(){ float a = pow(1.0 - vUv.y, 2.2) * op; gl_FragColor = vec4(0.62, 0.92, 1.0, a); }` });
      const parede = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 1, 160, 1, true), ondaMat2); parede.position.copy(ORIGEM); cidade.add(parede);
      const anelMat = new THREE.MeshBasicMaterial({ color: 0xe6fbff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, fog: false });
      const anel = new THREE.Mesh(new THREE.RingGeometry(0.97, 1, 128), anelMat); anel.rotation.x = -Math.PI / 2; anel.position.set(ORIGEM.x, 0.3, ORIGEM.z); cidade.add(anel);

      const cena1 = new THREE.Scene();
      cena1.background = new THREE.Color(0x0c1424);
      cena1.fog = new THREE.Fog(0x4a4a66, 70, 175); cena1.background = cena1.fog.color;
      cena1.add(cidade);
      const ceu = new THREE.HemisphereLight(0x7f92c4, 0x2a2a3a, 2.6); cena1.add(ceu);
      const lua = new THREE.DirectionalLight(0xaabbe6, 1.8); lua.position.set(-40, 80, 30); cena1.add(lua);
      const camC = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.5, 600);

      // ======================= GLOBO (Brasil → Terra inteira apagando) =======================
      const R = 10;
      const CONT = [
        [[-80,10],[-75,11],[-62,10.5],[-52,5],[-50,0],[-44,-2.5],[-35,-5],[-35,-9],[-39,-15],[-41,-22],[-48,-26],[-53,-34],[-58,-38],[-65,-42],[-67,-46],[-70,-52],[-74,-52],[-73,-45],[-73,-37],[-71,-30],[-70,-18],[-76,-13],[-81,-6],[-80,-2],[-78,2]],
        [[-168,66],[-156,71],[-140,70],[-125,70],[-95,72],[-80,68],[-62,60],[-56,52],[-66,45],[-70,42],[-76,35],[-81,31],[-80,25],[-83,29],[-90,29],[-97,26],[-97,21],[-92,18],[-88,16],[-84,11],[-79,9],[-83,8],[-87,13],[-94,16],[-105,20],[-110,24],[-112,31],[-117,32],[-121,35],[-124,40],[-124,48],[-130,55],[-140,60],[-150,60],[-160,58],[-165,62]],
        [[-50,60],[-42,60],[-20,70],[-20,80],[-40,83],[-60,80],[-70,77],[-55,70]],
        [[-17,21],[-16,28],[-10,30],[-6,36],[10,37],[20,32],[32,31],[34,28],[43,12],[51,12],[43,-1],[40,-10],[40,-16],[35,-24],[32,-29],[27,-34],[20,-35],[17,-29],[12,-18],[13,-8],[9,-1],[9,4],[4,6],[-8,4],[-13,8],[-17,14]],
        [[-10,36],[-9,43],[-2,44],[-5,48],[2,51],[8,54],[10,58],[5,62],[15,69],[28,71],[40,68],[60,70],[80,73],[100,77],[120,73],[140,72],[160,70],[180,68],[180,62],[163,59],[156,51],[142,46],[135,43],[129,35],[122,31],[121,25],[110,20],[106,10],[100,13],[100,3],[104,1],[98,8],[92,22],[88,22],[80,15],[77,8],[72,20],[67,25],[57,26],[52,24],[56,18],[44,12],[38,20],[34,28],[36,36],[27,37],[26,41],[22,37],[18,40],[12,44],[16,38],[8,44],[3,43],[-1,37]],
        [[114,-22],[122,-18],[130,-12],[137,-12],[142,-11],[146,-19],[153,-25],[150,-37],[141,-38],[130,-32],[117,-35],[115,-30]],
        [[-5,50],[1,51],[0,53],[-3,56],[-5,58],[-6,55],[-3,54],[-5,52]],
        [[130,31],[135,34],[140,36],[142,40],[141,45],[139,42],[136,36],[131,34]],
      ];
      const TW = 2048, TH = 1024, px = (lon) => (lon + 180) / 360 * TW, py = (lat) => (90 - lat) / 180 * TH;
      const tc = document.createElement("canvas"); tc.width = TW; tc.height = TH; const tg = tc.getContext("2d");
      tg.fillStyle = "#1a3b5e"; tg.fillRect(0, 0, TW, TH);
      for (const poly of CONT) {
        tg.beginPath(); poly.forEach(([lo, la], i) => (i ? tg.lineTo(px(lo), py(la)) : tg.moveTo(px(lo), py(la)))); tg.closePath();
        tg.fillStyle = "#566b52"; tg.fill(); tg.lineWidth = 3; tg.strokeStyle = "#5f7a62"; tg.stroke();
      }
      const terraTex = new THREE.CanvasTexture(tc); terraTex.colorSpace = THREE.SRGBColorSpace;
      const terra = new THREE.Mesh(new THREE.SphereGeometry(R, 96, 64), new THREE.MeshToonMaterial({ map: terraTex, gradientMap: k.grad }));
      const lonlat = (lon, lat, r) => {
        const ph = (lon + 180) / 360 * Math.PI * 2, th = (90 - lat) / 180 * Math.PI;
        return new THREE.Vector3(-r * Math.cos(ph) * Math.sin(th), r * Math.cos(th), r * Math.sin(ph) * Math.sin(th));
      };
      const dentro = (lo, la, poly) => {   // ponto-no-polígono (lon/lat planos: suficiente para sortear luzes)
        let d = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const [xi, yi] = poly[i], [xj, yj] = poly[j];
          if ((yi > la) !== (yj > la) && lo < (xj - xi) * (la - yi) / (yj - yi) + xi) d = !d;
        }
        return d;
      };
      const SP = lonlat(-46.6, -23.5, 1).normalize();
      const gp = [], ga = [], r2 = Cena.prng(31);
      let tent = 0;
      while (gp.length < 3600 * 3 && tent < 60000) {
        tent++;
        const lo = -180 + r2() * 360, la = -55 + r2() * 130;
        if (!CONT.some((p) => dentro(lo, la, p))) continue;
        const v = lonlat(lo, la, R * 1.004); gp.push(v.x, v.y, v.z); ga.push(Math.acos(Math.min(1, v.clone().normalize().dot(SP))));
      }
      for (let i = 0; i < 260; i++) {   // mancha densa de São Paulo e do Sudeste
        const rr = 3.2 * Math.sqrt(r2()) * (0.4 + 0.6 * r2()), aa = r2() * Math.PI * 2; const v = lonlat(-46.6 + Math.cos(aa) * rr * 1.2, -23.5 + Math.sin(aa) * rr, R * 1.004); gp.push(v.x, v.y, v.z); ga.push(Math.acos(Math.min(1, v.clone().normalize().dot(SP))));
      }
      const vertG = `
        attribute float ang; uniform float onda; varying float vV;
        void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vV = step(onda, ang);
          vec3 n = normalize((modelMatrix * vec4(position, 1.0)).xyz); vec3 cdir = normalize(cameraPosition);
          float frente = step(0.05, dot(n, cdir));
          gl_PointSize = vV * frente * clamp(3.0 * (30.0 / -mv.z), 2.2, 4.5); gl_Position = projectionMatrix * mv; }`;
      const fragG = `varying float vV; void main() { if (vV < 0.5) discard; vec2 c = gl_PointCoord - 0.5; if (dot(c, c) > 0.25) discard; gl_FragColor = vec4(1.0, 0.78, 0.42, 1.0); }`;
      const geoG = new THREE.BufferGeometry();
      geoG.setAttribute("position", new THREE.BufferAttribute(new Float32Array(gp), 3));
      geoG.setAttribute("ang", new THREE.BufferAttribute(new Float32Array(ga), 1));
      const luzesG = new THREE.Points(geoG, new THREE.ShaderMaterial({ vertexShader: vertG, fragmentShader: fragG, uniforms: { onda: { value: 0 } } }));
      luzesG.frustumCulled = false;
      // anel da onda sobre o globo (em volta do eixo São Paulo)
      const anelG = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 6, 160), new THREE.MeshBasicMaterial({ color: 0xbff4ff, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
      const eixo = new THREE.Group(); eixo.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), SP); eixo.add(anelG);
      const atm = new THREE.Mesh(new THREE.SphereGeometry(R * 1.035, 64, 48), new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, side: THREE.BackSide, blending: THREE.AdditiveBlending,
        vertexShader: `varying vec3 vN; varying vec3 vP; void main(){ vN = normalize(normalMatrix * normal); vP = (modelViewMatrix * vec4(position,1.0)).xyz; gl_Position = projectionMatrix * vec4(vP,1.0); }`,
        fragmentShader: `varying vec3 vN; varying vec3 vP; void main(){ float f = pow(1.0 - abs(dot(normalize(-vP), vN)), 5.0); gl_FragColor = vec4(0.35, 0.6, 1.0, f * 0.45); }`,
      }));
      const terraG = new THREE.Group(); terraG.add(terra, luzesG, eixo, atm);
      const cena2 = new THREE.Scene(); cena2.background = new THREE.Color(0x03050a); cena2.add(terraG);
      const estrelas = [], r3 = Cena.prng(77);
      for (let i = 0; i < 1500; i++) { const v = new THREE.Vector3(r3() - 0.5, r3() - 0.5, r3() - 0.5).normalize().multiplyScalar(300); estrelas.push(v.x, v.y, v.z); }
      const geoE = new THREE.BufferGeometry(); geoE.setAttribute("position", new THREE.BufferAttribute(new Float32Array(estrelas), 3));
      cena2.add(new THREE.Points(geoE, new THREE.PointsMaterial({ color: 0xcfd8ea, size: 0.9, sizeAttenuation: false })));
      cena2.add(new THREE.HemisphereLight(0x9ab0e0, 0x202030, 2.0));
      const solG = new THREE.DirectionalLight(0x9fb4e8, 0.9); solG.position.set(-30, 20, 10); cena2.add(solG);
      const camG = new THREE.PerspectiveCamera(36, 1920 / 1080, 0.1, 800);

      const renderer = Cena.renderer("ab-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };

      function render() {
        const t = estado.t;
        // relógio acelerando 23:30 -> 03:30 (aceleração forte no fim); depois fica em 03:30
        const u = Math.min(1, t / LAPSO), min = Math.floor(240 * u * u * (0.35 + 0.65 * u) / (1)) ;
        const tot = 23 * 60 + 30 + Math.min(240, min), hh = Math.floor(tot / 60) % 24, mm = tot % 60;
        horaEl.textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
        // FLASH: 2 quadros estourados e um decaimento curto (em silêncio)
        flashEl.style.opacity = t < FLASH ? 0 : (t < FLASH + 0.07 ? 1 : Math.max(0, 1 - (t - FLASH - 0.07) / 0.35));
        const look = LOOK;
        if (t < GLOBO) {
          // janelas apagando no lapso (gente indo dormir); a onda apaga o resto ao passar
          const lap = u * 1.0;
          const rOnda = t < ONDA0 ? -1 : 260 * S((t - ONDA0) / (ONDA1 - ONDA0 - 0.3));
          for (const p of predios) {
            const pegou = rOnda > 0 && Math.hypot(p.x - ORIGEM.x, p.z - ORIGEM.z) < rOnda;
            p.jan.visible = !pegou && lap < p.apaga;
            if (p.apaga === 2 && p.jan.visible) p.jan.visible = ((t * 0.8 + p.jan.userData.pisca) % 1) < 0.5;
          }
          for (const q of [postes, farois]) { q.mat.uniforms.lapso.value = lap; q.mat.uniforms.raio.value = rOnda; }
          // carros andando nas avenidas (param quando a onda passa)
          const arr = farois.geo.attributes.position.array;
          cdat.forEach((c, i) => {
            const s = ((c.o + c.v * Math.min(t, ONDA0 + 0.5)) % EXT + EXT) % EXT - EXT / 2, a = -EXT / 2 + (c.av + 6) * PASSO + 1.0;
            arr[i * 3] = c.eixo ? s : a; arr[i * 3 + 1] = 0.5; arr[i * 3 + 2] = c.eixo ? a : s;
          });
          farois.geo.attributes.position.needsUpdate = true;
          // a onda: parede + anel; cidade e céu escurecem depois
          const vis = rOnda > 0;
          parede.visible = anel.visible = vis;
          if (vis) {
            parede.scale.set(rOnda, 30, rOnda); parede.position.y = 15;
            ondaMat2.uniforms.op.value = 0.9 * (1 - rOnda / 300); anel.scale.set(rOnda, rOnda, 1); anelMat.opacity = 0.9 * (1 - rOnda / 300);
          }
          const escuro = vis ? S(rOnda / 200) : 0;
          cena1.fog.color.setHex(0x4a4a66).lerp(new THREE.Color(0x363a50), escuro);
          ceu.intensity = 2.6 - 0.25 * escuro;
          // câmera: fixa e lenta no lapso; tranco no boom; depois sobe
          const v = S(t / LAPSO), sobe = S((t - 6.6) / 1.4);
          camC.position.set(-8 + 4 * v, 64 + 40 * sobe, 88 - 8 * v + 20 * sobe);
          if (t > ONDA0 && t < ONDA0 + 0.6) { const a = (1 - (t - ONDA0) / 0.6) * 0.5; camC.position.x += Math.sin(t * 70) * a; camC.position.y += Math.sin(t * 53 + 1) * a; }
          camC.lookAt(2, 0, -32 - 10 * sobe);
          pos.render(cena1, camC, t, look);
        } else {
          // globo: começa perto do Brasil (já apagando) e recua até a Terra inteira; a onda dá a volta no planeta
          const g = S((t - GLOBO) / (DUR - GLOBO - 0.6));
          const ang = 0.03 + Math.PI * S((t - GLOBO - 0.5) / (DUR - GLOBO - 0.7));
          luzesG.material.uniforms.onda.value = ang;
          anelG.scale.setScalar(R * 1.006 * Math.sin(ang)); anelG.position.z = R * 1.006 * Math.cos(ang);
          anelG.material.opacity = 0.9 * (1 - S((t - DUR + 0.8) / 0.8));
          terraG.rotation.y = -0.15 * g;
          const dist = 14 + 34 * g;
          const alvo = SP.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), terraG.rotation.y);
          const lado = new THREE.Vector3(0, 1, 0).cross(alvo).normalize();
          camG.position.copy(alvo.clone().multiplyScalar(dist)).add(lado.multiplyScalar(-3 * g)).add(new THREE.Vector3(0, 4 * g, 0));
          camG.lookAt(alvo.clone().multiplyScalar(R * (1 - g)));
          pos.render(cena2, camG, t, look);
        }
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines["abertura"] = tl;
      render();
    })();
  </script>
</template>
