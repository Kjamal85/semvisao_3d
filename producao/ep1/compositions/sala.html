      scene.add(brilhoTV); scene.add(brilhoTV.target);

      // ---------- câmeras ----------
      const camA = new THREE.PerspectiveCamera(42, 1920 / 1080, 0.1, 60);        // plano aberto (35)
      const camB = new THREE.PerspectiveCamera(30, 1920 / 1080, 0.1, 60);        // a TV (36)

      const renderer = Cena.renderer("s-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };
      function render() {
        const t = estado.t;
        // a repórter fala: boca abre e fecha num ritmo irregular, sempre o mesmo em cada render
        const fala = Math.sin(t * 17) + Math.sin(t * 7.3 + 1) > 0.35;
        bocaR.linha.visible = !fala; bocaR.o.visible = fala;
        reporter.userData.rig.head.rotation.set(Math.sin(t * 1.3) * 0.04, Math.sin(t * 0.8) * 0.06, 0);
        renderer.setRenderTarget(alvoTV); renderer.render(estudio, camE); renderer.setRenderTarget(null);
        // brilho da TV pulsa com a imagem (cortes do telejornal)
        brilhoTV.intensity = 5.2 + 1.1 * Math.sin(t * 3.1) * Math.sin(t * 1.7 + 0.5) + (Math.floor(t * 1.5) % 3 === 0 ? 0.9 : 0);
        // vida: respiração; o Gabi soluça de leve; a mão da mãe acaricia o ombro
        const r1 = Math.sin(t * 2 * Math.PI * 0.32);
        Elenco.cabeca(gabi, 0.22 + Math.max(0, Math.sin(t * 2.6)) * 0.03, 0.4, 0.06, r1 * 0.008);   // soluço leve
        rm.aR.el.rotation.x = -0.4 + Math.sin(t * 1.6) * 0.08;
        Elenco.cabeca(pai, 0.12 + Math.sin(t * 0.5) * 0.02, -0.15 + Math.sin(t * 0.6) * 0.05, 0.08, Math.sin(t * 2 * Math.PI * 0.25) * 0.008);
        rp.aR.el.rotation.x = -2.05 + Math.sin(t * 0.9) * 0.06;                          // a mão esfrega a nuca
        let cam;
        if (t < CORTE) {
          const u = Cena.suave(t / CORTE);
          camA.position.set(-2.75 + 0.3 * u, 2.35 - 0.12 * u, 3.6 - 0.4 * u); camA.lookAt(0.85, 1.15, -0.75); cam = camA;
        } else {
          const u = Cena.suave((t - CORTE) / (DUR - CORTE));
          camB.position.set(-0.55 - 0.45 * u, 1.5, TZ + 0.25 - 0.1 * u); camB.lookAt(X0, TV_Y - 0.02, TZ); cam = camB;
        }
        pos.render(scene, cam, t, LOOK);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines["sala"] = tl;
      render();
    })();
  </script>
</template>
