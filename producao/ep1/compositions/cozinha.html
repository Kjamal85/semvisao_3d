      box(0.66, 0.02, 0.4, 0x6f747a, PX, BH + 0.025, BZ + 0.02, { contorno: false });

      for (const [dx, dz] of [[-0.7, -0.4], [0.7, -0.4], [-0.7, 0.4], [0.7, 0.4]]) box(0.07, 0.97, 0.07, 0x6e4c37, MX + dx, 0.485, MZ + dz);

      }

      // pano de prato pendurado no forno e tapetinho na frente da pia

      for (let i = 0; i < 3; i++) box(0.22, 0.03, 0.016, 0xc94a3e, FX + 0.2, 0.62 + i * 0.1, BZ + 0.42, { contorno: false });
      const tap = cil(0.5, 0.5, 0.02, 0x7a8f9a, PX, 0.012, BZ + 0.95, { contorno: false, sombra: false }); tap.scale.set(1.3, 1, 0.65);

      // ---------- copo na cuba, sob a torneira; o Gabi segura e tateia, cego ----------
      const vidro = new THREE.MeshToonMaterial({ color: 0xd8ecf6, gradientMap: k.grad, transparent: true, opacity: 0.45 });
      const aguaM = new THREE.MeshToonMaterial({ color: 0x8fbfde, gradientMap: k.grad, transparent: true, opacity: 0.7 });
      const COPO = new THREE.Vector3(PX, BH + 0.03, BZ + 0.03);                               // base do copo, sob a boca
      cil(0.065, 0.055, 0.2, 0, COPO.x, COPO.y + 0.1, COPO.z, { mat: vidro, seg: 16 });
      cil(0.06, 0.052, 0.19, 0, COPO.x, COPO.y + 0.095, COPO.z, { mat: aguaM, seg: 16, contorno: false });

      // filete vertical da torneira até a boca do copo
      const filete = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.016, BOCA.y - pTop.y, 8), new THREE.MeshBasicMaterial({ color: 0xcfe8f6, transparent: true, opacity: 0.75 }));

      // o copo cheio transborda pela borda e escorre pelos dedos (gotas pequenas, em fio)

      const gabi = Elenco.build("gabi", { blind: true, expr: "firme" });

      const rg = gabi.userData.rig;
      Elenco.cabeca(gabi, 0.15, -0.3, 0);
      raiz.updateMatrixWorld(true);
      Elenco.alcancar(gabi, "esq", new THREE.Vector3(COPO.x + 0.07, COPO.y + 0.1, COPO.z + 0.06));   // mão no copo
      Elenco.alcancar(gabi, "dir", new THREE.Vector3(0.95, BH + 0.1, BZ + 0.36));                     // mão tateia a borda
      const braco = { esq: [rg.aR.sh.rotation.x, rg.aR.sh.rotation.z, rg.aR.el.rotation.x], dir: [rg.aL.sh.rotation.x, rg.aL.sh.rotation.z, rg.aL.el.rotation.x] };

      // ---------- a mãe na porta, segurando o batente, sem entrar ----------

      mae.position.set(X0 + 0.35, 0, (PZ0 + PZ1) / 2); mae.rotation.y = Math.PI / 2 - 0.55; raiz.add(mae);
      const rm = mae.userData.rig;

      rm.aL.sh.rotation.set(-0.2, 0, -0.1); rm.aL.el.rotation.x = -1.3;
      // mão no batente: testa os dois lados e fica com o que alcança
      raiz.updateMatrixWorld(true);
      const dE = Elenco.alcancar(mae, "esq", new THREE.Vector3(X0 + 0.12, 1.35, PZ1 - 0.06));
      if (dE > 0.08) { rm.aR.sh.rotation.set(-0.2, 0, 0.1); rm.aR.el.rotation.x = -1.3; Elenco.alcancar(mae, "dir", new THREE.Vector3(X0 + 0.12, 1.35, PZ0 + 0.06)); }
      Elenco.cabeca(mae, 0.06, 0.2, -0.08);

      // ---------- luz: sol de tarde pela janela ----------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1d24);
      scene.fog = new THREE.Fog(0xd9cdb4, 12, 30);
      scene.add(raiz);
      scene.add(new THREE.HemisphereLight(0xe2d6be, 0x5a4c3e, 1.35));
      const sol = new THREE.DirectionalLight(0xffd6a0, 2.7);
      sol.position.set(1.6, 4.6, -9); sol.target.position.set(0.0, 0.6, 0.8);
      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.03;
      Object.assign(sol.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 0.5, far: 25 });
      scene.add(sol); scene.add(sol.target);

      const camA = new THREE.PerspectiveCamera(44, 1920 / 1080, 0.1, 60);
      const camB = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 60);
      const renderer = Cena.renderer("c-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };
      function render() {
        const t = estado.t;
        // vida: respiração; o polegar da mão livre corre a borda da pia
        Elenco.cabeca(gabi, 0.15 + Math.sin(t * 0.7) * 0.03, -0.3 + Math.sin(t * 0.5) * 0.08, 0, Math.sin(t * 2 * Math.PI * 0.3) * 0.008);
        rg.aL.sh.rotation.z = braco.dir[1] + Math.sin(t * 0.9) * 0.04;                       // a mão livre corre a borda
        rg.aR.el.rotation.x = braco.esq[2] + Math.sin(t * 1.4) * 0.015;
        Elenco.cabeca(mae, 0.06 + Math.sin(t * 0.6) * 0.02, 0.2, -0.08);
        raiz.updateMatrixWorld(true);
        // o copo já está cheio: a água escorre pela borda do lado da mão e pinga na cuba
        for (const g of gotas) {
          const f = (t * 1.6 + g.userData.fase) % 1;
          g.position.set(pTop.x + Math.cos(g.userData.ang) * 0.068, pTop.y - f * (pTop.y - BH), pTop.z + Math.sin(g.userData.ang) * 0.068);
        }
        const r = 0.12 + 0.18 * Math.min(1, t / DUR); poca.scale.set(r / 0.2 * 1.4, 1, r / 0.2);
        let cam;
        if (t < CORTE) {
          const u = Cena.suave(t / CORTE);
          camA.position.set(3.45 - 0.25 * u, 2.15 - 0.05 * u, -1.75 - 0.15 * u); camA.lookAt(-0.45, 1.4, -1.15); cam = camA;
        } else {
          const u = Cena.suave((t - CORTE) / (DUR - CORTE));
          camB.position.set(pTop.x - 0.7 + 0.08 * u, pTop.y + 0.28, pTop.z + 0.72 - 0.08 * u); camB.lookAt(pTop.x + 0.12, pTop.y - 0.02, pTop.z + 0.05); cam = camB;
        }
        pos.render(scene, cam, t, LOOK);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines["cozinha"] = tl;
      render();
    })();
  </script>
