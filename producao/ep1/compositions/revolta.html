<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #rv-stage { position: absolute; inset: 0; z-index: 0; }
    #rv-stage canvas { display: block; }
    #rv-rotulo { position: absolute; left: 60px; bottom: 50px; z-index: 2; padding: 14px 22px;
      background: rgba(10, 12, 18, 0.72); color: #e9ecf2; font-family: sans-serif;
      font-size: 30px; font-weight: 700; letter-spacing: .03em; border-radius: 6px; }
    #rv-rotulo small { display: block; font-size: 28px; font-weight: 400; color: #c3c9d4; margin-top: 4px; }
  </style>
  <div id="root" data-composition-id="revolta" data-width="1920" data-height="1080">
    <div id="rv-stage" class="clip" data-start="0" data-duration="10" data-track-index="0"></div>
    <div id="rv-rotulo" class="clip" data-start="0" data-duration="10" data-track-index="1">CENA — A REVOLTA<small>varre a mesa · joga · chuta · "Por que isso aconteceu comigo?!" · planos 25–31</small></div>
    <audio id="rv-grito" class="clip" src="voz/audio/c03-gabi-03.wav" data-start="2.0" data-duration="2.78" data-track-index="2" data-volume="1"></audio>
  </div>
  <script>
    (function () {
      const DUR = 10, C = [0, 0.45, 0.9, 1.35, 1.8, 4.8, 7.2];   // cortes
      const VARRE = 0.55, JOGA = 1.0, CHUTA = 1.45, GRITO = 2.0, FALHA = 4.3, ABRACA = 5.0, ESCORREGA = 7.4;
      const LOOK = { grao: Pos.GRAO.baixo, fumaca: 0.15, dessat: 0.2 };   // padrão do modo cego
      const S = Cena.suave, V = (x, y, z) => new THREE.Vector3(x, y, z);

      const sala = new THREE.Group();
      const Q = Cenarios.quarto(sala);
      const { k, X0, mesa, cad, DX, DZ, fone } = Q;
      // pivô no centro de cada item da mesa, para voar girando em volta de si
      const pivo = (g) => { sala.updateMatrixWorld(true); const c = new THREE.Box3().setFromObject(g).getCenter(V()); const p = new THREE.Group(); p.position.copy(c); sala.add(p); p.attach(g); return { p, c }; };
      const VOO = [
        { ...pivo(mesa.note), t0: VARRE, v: V(1.2, 1.3, 2.0), w: V(2, 5, 1) },
        { ...pivo(mesa.livros), t0: VARRE + 0.05, v: V(1.9, 1.6, 1.1), w: V(4, 2, 3) },
        { ...pivo(mesa.lapis), t0: VARRE + 0.08, v: V(0.9, 2.0, 2.3), w: V(6, 1, 5) },
        { ...pivo(mesa.vaso), t0: JOGA, v: V(-4.6, 1.6, 0.9), w: V(3, 6, 2), parede: X0 + 0.25 },
      ];
      function voa(item, t) {
        const dt = Math.max(0, t - item.t0), g = -9.0;
        let x = item.c.x + item.v.x * dt, y = item.c.y + item.v.y * dt + 0.5 * g * dt * dt, z = item.c.z + item.v.z * dt;
        if (item.parede !== undefined && x < item.parede) x = item.parede;      // bate na parede da janela e cai
        const noChao = y < 0.08; if (noChao) y = 0.08;
        item.p.position.set(x, y, z);
        const giro = noChao ? Math.min(dt, 0.6) : dt;
        item.p.rotation.set(item.w.x * giro, item.w.y * giro, item.w.z * giro);
      }
      const cad0 = { pos: cad.position.clone(), rot: cad.rotation.clone() };

      // ---------- o Gabi, a mãe, o pai ----------
      const gabi = Elenco.build("gabi", { blind: true, expr: "raiva" }); sala.add(gabi); const rg = gabi.userData.rig;
      const mae = Elenco.build("mae", { expr: "medo" }); sala.add(mae); const rm = mae.userData.rig;
      const pai = Elenco.build("pai", { expr: "medo" }); sala.add(pai); const rp = pai.userData.rig;
      const G1 = V(DX - 1.05, 0, DZ + 1.0), RY1 = Math.atan2(DX - G1.x, DZ - G1.z);   // na frente da mesa
      const G2 = V(DX - 1.35, 0, DZ + 1.45);                                           // vira para o quarto e grita
      const guarda = (b) => [b.sh.rotation.clone(), b.el.rotation.clone()];
      const E = (x, y, z) => new THREE.Euler(x, y, z);
      const mistura = (b, A, B, u) => {
        b.sh.rotation.set(A[0].x + (B[0].x - A[0].x) * u, A[0].y + (B[0].y - A[0].y) * u, A[0].z + (B[0].z - A[0].z) * u);
        b.el.rotation.set(A[1].x + (B[1].x - A[1].x) * u, A[1].y + (B[1].y - A[1].y) * u, A[1].z + (B[1].z - A[1].z) * u);
      };
      // pose final: sentado no chão abraçando os joelhos; a mãe ajoelhada atrás, mãos nos ombros dele
      function poseFinal() {
        gabi.position.set(G2.x, 0.12 - 1.075, G2.z); gabi.rotation.set(0, 0, 0);
        for (const l of [rg.pL, rg.pR]) { l.hip.rotation.set(-2.05, 0, 0); l.knee.rotation.set(2.1, 0, 0); }
        mae.position.set(G2.x - 0.05, -0.5, G2.z - 0.75); mae.rotation.set(0, 0.1, 0);
        for (const l of [rm.pL, rm.pR]) { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(Math.PI / 2, 0, 0); }
      }
      poseFinal(); sala.updateMatrixWorld(true);
      Elenco.alcancar(gabi, "esq", gabi.localToWorld(V(0.16, 0.9, 0.62)), { foraDoCorpo: true }); const joelhoE = guarda(rg.aR);
      Elenco.alcancar(gabi, "dir", gabi.localToWorld(V(-0.16, 0.95, 0.66)), { foraDoCorpo: true }); const joelhoD = guarda(rg.aL);
      Elenco.alcancar(mae, "esq", gabi.localToWorld(V(0.3, 1.7, -0.05)), { foraDoCorpo: true }); const mOmbroE = guarda(rm.aR);
      Elenco.alcancar(mae, "dir", gabi.localToWorld(V(-0.3, 1.7, -0.05)), { foraDoCorpo: true }); const mOmbroD = guarda(rm.aL);
      // abraço por trás, em pé (ele em G2 olhando +z, ela logo atrás)
      gabi.position.copy(G2); for (const l of [rg.pL, rg.pR]) { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(0, 0, 0); }
      mae.position.set(G2.x, 0, G2.z - 0.5); for (const l of [rm.pL, rm.pR]) l.knee.rotation.set(0, 0, 0);
      sala.updateMatrixWorld(true);
      Elenco.alcancar(mae, "esq", gabi.localToWorld(V(0.24, 1.48, 0.27)), { foraDoCorpo: true }); const mAbE = guarda(rm.aR);
      Elenco.alcancar(mae, "dir", gabi.localToWorld(V(-0.24, 1.52, 0.27)), { foraDoCorpo: true }); const mAbD = guarda(rm.aL);
      const solto = [E(-0.05, 0, -0.08), E(-0.2, 0, 0)], soltoE = [E(-0.05, 0, 0.08), E(-0.2, 0, 0)];
      const punhoD = [E(0.05, 0, -0.2), E(-0.35, 0, 0)], punhoE = [E(0.05, 0, 0.2), E(-0.35, 0, 0)];
      const foneMesa = { parent: fone.parent, pos: fone.position.clone(), rot: fone.rotation.clone() };

      // ---------- luz: a mesma do quarto ----------
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x12151c);
      scene.fog = new THREE.Fog(0x283044, 9, 24);
      scene.add(sala);
      scene.add(new THREE.HemisphereLight(0x95a7c8, 0x4a3e34, 3.7));
      const sol = new THREE.DirectionalLight(0xd8e2f2, 3.2);
      sol.position.set(X0 - 6, 6.2, -0.3); sol.target.position.set(-0.6, 0, -0.9);
      sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006;
      Object.assign(sol.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 20 });
      scene.add(sol); scene.add(sol.target);
      const rosto = new THREE.PointLight(0xa9b8d6, 2.2, 4.5, 1.5); scene.add(rosto);

      const cam = new THREE.PerspectiveCamera(40, 1920 / 1080, 0.05, 60);
      const renderer = Cena.renderer("rv-stage");
      const pos = Pos.criar(renderer, 1920, 1080);
      const estado = { t: 0 };
      const expr = (g, n) => { if (g.userData.rig.ficha.expr !== n) Elenco.expressao(g, n); };

      function render() {
        const t = estado.t;
        for (const it of VOO) voa(it, t);
        // a cadeira: chutada, tomba de lado e desliza
        const tomb = S((t - CHUTA - 0.05) / 0.3);
        cad.position.set(cad0.pos.x + 0.45 * tomb, 0.3 * Math.sin(Math.PI * tomb) * 0.4, cad0.pos.z - 0.2 * tomb);
        cad.rotation.set(cad0.rot.x, cad0.rot.y, cad0.rot.z - 1.45 * tomb);
        mae.visible = t >= C[5]; pai.visible = t >= C[5];
        gabi.rotation.order = "YXZ";
        let alvo;
        if (t < C[4]) {
          // ---- a fúria: cambaleia até a mesa, varre, joga, chuta ----
          expr(gabi, "raiva");
          const chega = S(t / 0.5);
          gabi.position.set(G1.x - 0.5 * (1 - chega), 0, G1.z + 0.4 * (1 - chega));
          gabi.rotation.set(0.08 * Math.sin(t * 9), RY1 + 0.25 * Math.sin(t * 4), 0.06 * Math.sin(t * 7));
          const passo = t < 0.5 ? Math.sin(t * 14) * 0.3 : 0;
          const chute = Math.sin(Math.PI * S((t - CHUTA + 0.1) / 0.35));
          rg.pL.hip.rotation.set(passo, 0, 0); rg.pR.hip.rotation.set(-passo - 1.1 * chute, 0, 0);
          rg.pL.knee.rotation.set(0, 0, 0); rg.pR.knee.rotation.set(0.5 * chute, 0, 0);
          // braço direito varre a mesa (de fora para dentro), o esquerdo arremessa
          const varre = S((t - VARRE + 0.12) / 0.3);
          rg.aL.sh.rotation.set(-1.3, 0, -1.0 + 1.6 * varre); rg.aL.el.rotation.set(-0.2, 0, 0);
          const joga = S((t - JOGA + 0.15) / 0.25);
          rg.aR.sh.rotation.set(-2.3 + 1.6 * joga, 0, 0.3); rg.aR.el.rotation.set(-1.2 + 1.0 * joga, 0, 0);
          Elenco.mao(gabi, "dir", "aberta", 1); Elenco.mao(gabi, "esq", joga < 0.5 ? "segura" : "aberta", 1);
          Elenco.cabeca(gabi, 0.05, 0.2 * Math.sin(t * 5), 0.08 * Math.sin(t * 6));
          if (t < C[1]) { cam.fov = 44; cam.position.set(G1.x + 1.6, 2.0, G1.z + 3.2); alvo = V(G1.x, 1.4, G1.z); }
          else if (t < C[2]) { cam.fov = 62; cam.position.set(DX + 0.75, 2.05, DZ + 0.55); alvo = V(G1.x, 1.75, G1.z); }
          else if (t < C[3]) { cam.fov = 60; cam.position.set(G1.x + 1.7, 2.1, G1.z + 0.25); alvo = V(G1.x - 0.4, 1.75, G1.z + 0.1); }
          else { cam.fov = 42; cam.position.set(G1.x + 1.9, 0.7, G1.z + 1.6); alvo = V(DX - 0.2, 0.6, DZ + 0.9); }
          cam.position.x += Math.sin(t * 60) * 0.02; cam.position.y += Math.sin(t * 47) * 0.02;   // câmera na mão (pânico)
        } else {
          // ---- o grito, de frente; a mãe abraça por trás; ele escorrega até o chão ----
          const desce = S((t - ESCORREGA) / 1.4);
          gabi.position.set(G2.x, (0.12 - 1.075) * desce, G2.z); gabi.rotation.set(0, 0, 0);
          for (const l of [rg.pL, rg.pR]) { l.hip.rotation.set(-2.05 * desce, 0, 0); l.knee.rotation.set(2.1 * desce, 0, 0); }
          const fecha = S((t - ESCORREGA - 0.6) / 0.8);
          mistura(rg.aL, punhoD, joelhoD, fecha); mistura(rg.aR, punhoE, joelhoE, fecha);
          const treme = Math.sin(t * 29) * 0.03 * (t < ABRACA ? 1 : 0.4);
          rg.aL.sh.rotation.z += treme; rg.aR.sh.rotation.z -= treme;
          Elenco.mao(gabi, "dir", "punho", 1 - fecha * 0.4); Elenco.mao(gabi, "esq", "punho", 1 - fecha * 0.4);
          // o fone na mão direita quando ele abraça os joelhos
          if (t > ESCORREGA + 0.8) { if (fone.parent !== rg.aL.el) rg.aL.el.add(fone); fone.position.set(0, -0.55, 0.06); fone.rotation.set(0.3, 0, 1.2); }
          else if (fone.parent !== foneMesa.parent) { foneMesa.parent.add(fone); fone.position.copy(foneMesa.pos); fone.rotation.copy(foneMesa.rot); }
          expr(gabi, t < FALHA ? "grito" : "choro");
          Elenco.lagrimas(gabi, S((t - FALHA) / 0.6), t);
          const resp = Math.sin(t * 2 * Math.PI * (t < ESCORREGA ? 1.1 : 0.6)) * 0.014;
          Elenco.cabeca(gabi, t < FALHA ? -0.12 : 0.1 + 0.08 * desce, t < FALHA ? 0.06 * Math.sin(t * 7) : 0, 0, resp);
          // a mãe: entra por trás, abraça; depois ajoelha com ele, mãos nos ombros
          const entra = S((t - C[5]) / 0.3), abraca = S((t - ABRACA) / 0.5);
          mae.position.set(G2.x, -0.5 * desce, G2.z - 0.5 - 0.6 * (1 - entra) - 0.25 * desce);
          for (const l of [rm.pL, rm.pR]) { l.hip.rotation.set(0, 0, 0); l.knee.rotation.set(Math.PI / 2 * desce, 0, 0); }
          mistura(rm.aR, soltoE, mAbE, abraca); mistura(rm.aL, solto, mAbD, abraca);
          if (desce > 0) { mistura(rm.aR, mAbE, mOmbroE, desce); mistura(rm.aL, mAbD, mOmbroD, desce); }
          Elenco.mao(mae, "esq", "aberta", abraca); Elenco.mao(mae, "dir", "aberta", abraca);
          expr(mae, t < ESCORREGA ? "medo" : "triste");
          Elenco.cabeca(mae, 0.18, 0.35, 0.05);
          // o pai: paralisado na porta (lado direito do quarto)
          pai.position.set(3.0, 0, -0.15); pai.rotation.set(0, -1.75, 0);
          rp.aL.sh.rotation.set(-0.15, 0, -0.1); rp.aR.sh.rotation.set(-0.15, 0, 0.1);
          Elenco.cabeca(pai, 0.06, 0, 0);
          if (t < C[5]) { cam.fov = 34; const v = S((t - C[4]) / 3); cam.position.set(G2.x + 0.25, 1.95, G2.z + 2.6 - 0.4 * v); alvo = V(G2.x, 2.05, G2.z); }
          else if (t < C[6]) { cam.fov = 44; cam.position.set(G2.x + 1.3, 2.1, G2.z + 3.6); alvo = V(G2.x + 0.5, 1.6, G2.z); }
          else { cam.fov = 42; const v = S((t - C[6]) / 2.8); cam.position.set(G2.x + 0.9, 1.6 - 0.45 * v, G2.z + 3.0 - 0.3 * v); alvo = V(G2.x + 0.1, 1.2 - 0.45 * v, G2.z - 0.1); }
        }
        rosto.position.set(gabi.position.x + 0.7, 2.4, gabi.position.z + 1.6);
        cam.updateProjectionMatrix(); cam.lookAt(alvo);
        // estrondos: só o grão pulsa a cada impacto
        const pico = [VARRE, JOGA + 0.25, CHUTA + 0.2].reduce((m, x) => Math.max(m, 1 - Math.abs(t - x) / 0.25), 0);
        pos.render(scene, cam, t, { grao: LOOK.grao + 0.1 * Math.max(0, pico), fumaca: LOOK.fumaca, dessat: LOOK.dessat });
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines["revolta"] = tl;
      render();
    })();
  </script>
</template>
