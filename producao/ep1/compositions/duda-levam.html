<template>
  <style>
    #root { position: absolute; inset: 0; background: #000; }
    #dlv-stage { position: absolute; inset: 0; z-index: 0; }
    #dlv-stage canvas { display: block; }
  </style>
  <div id="root" data-composition-id="duda-levam" data-width="1920" data-height="1080">
    <div id="dlv-stage" class="clip" data-start="0" data-duration="23" data-track-index="0"></div>
  </div>
  <script>
    (function () {
      // planos 68-74 (anoitecer), o clímax compartilhado. CÂMERA NA MÃO (a única do episódio) em todos os planos.
      // 0-3,5 POV da janela: o espelho do plano 68 do EP1 — o Gabi forçado até a van, as mãos agarrando o moletom no
      // peito, os pais contidos na porta (c10-mae-04, longe) · 3,5-7 close da Duda na janela: puxa o ar, curto; boca
      // entreaberta (c10-gabi-05, longe) · 7-11 ela sai correndo, 4 cortes de ~1 s: quarto → cozinha e a porta da frente →
      // saindo pela porta (lado de fora) → o quintal · 11-14 chega ao portãozinho, a mão na grade, não atravessa; o
      // clangor da porta da van em 11,5 · 14-17 a van arranca; a luz azul e vermelha varre o rosto dela e some ·
      // 17-20 do outro lado, a mãe do Gabi corre até o portão e chama a rua vazia (c10-mae-05a, boca em sync) ·
      // 20-23 a Duda travada no portão, boca entreaberta (c10-mae-05b, mais fraco, a mãe fora de quadro).
      // Dois mundos: FORA (a rua com a fachada dela) e DENTRO (a casa dela por dentro); cada plano usa um.
      const DUR = 23, CENA = "duda-levam", S = EP2.S, V = EP2.V;
      const RF = { refinado: true, material: "pbr" };
      // ======================= FORA =======================
      const F = EP2.mundo({ hora: "anoitecer", van: { x: 2.4, z: 0.1, ry: 0 } });
      const { R } = F, G = EP2.geo(F), FZ = R.FZ;
      for (const { pt, s } of R.portasVan) pt.rotation.y = s * 2.75;
      // a porta da frente dela aberta (luz de dentro) quando ela sai correndo
      const kf = Cena.kit(F.scene, 71);
      const portaLuz = kf.box(0.85, 2.0, 0.02, 0xf4c98a, -6.6, 1.02, R.FZ2 - 0.09, { mat: new THREE.MeshBasicMaterial({ color: 0xf4c98a }), contorno: false });
      const gabi = Elenco.build("gabi", Object.assign({ blind: true, expr: "grito" }, RF));
      const mae = Elenco.build("mae", Object.assign({ expr: "grito" }, RF));
      const pai = Elenco.build("pai", Object.assign({ expr: "raiva" }, RF));
      const dOut = Elenco.build("duda", Object.assign({ expr: "medo" }, RF));
      const ag = [Elenco.build("agente"), Elenco.build("agente"), Elenco.build("agente")];
      for (const g of [gabi, mae, pai, dOut, ...ag]) F.scene.add(g);
      // as mãos do Gabi agarrando o moletom no peito (o gesto do EP1): pose resolvida uma vez, parado na origem
      F.scene.updateMatrixWorld(true);
      Elenco.alcancar(gabi, "esq", V(0.12, 1.5, 0.43), { foraDoCorpo: true });
      Elenco.alcancar(gabi, "dir", V(-0.1, 1.38, 0.45), { foraDoCorpo: true });
      const rg = gabi.userData.rig, guarda = (b) => [b.sh.rotation.clone(), b.el.rotation.clone()];
      const poe = (b, A) => { b.sh.rotation.copy(A[0]); b.el.rotation.copy(A[1]); };
      const AGARRA_E = guarda(rg.aR), AGARRA_D = guarda(rg.aL), SOLTO = guarda(pai.userData.rig.aR);
      // os pais na porta arrebentada; o agente 2 na frente, de braços abertos barrando os dois
      const PAI0 = V(-1.25, 0, FZ + 0.35), MAE0 = V(-0.55, 0, FZ + 0.5), AG2 = V(-0.9, 0, FZ + 1.4);
      // ======================= DENTRO =======================
      const D = EP2.mundo({ hora: "anoitecer", dentro: true });
      const { Q, C, M } = D;
      Q.cortina(0); Q.janela(0); Q.luzinhas(true);
      const dIn = Elenco.build("duda", Object.assign({ expr: "medo" }, RF)); D.scene.add(dIn);
      const sir = new THREE.PointLight(0x4a6bff, 0, 6, 1.4); D.scene.add(sir);
      const sirF = new THREE.PointLight(0x4a6bff, 0, 7, 1.4); F.scene.add(sirF);   // a sirene no rosto dela, lá fora
      const pal = EP2.palco("dlv-stage");
      Elenco.ambiente(pal.renderer, F.scene, { forca: 0.3 });
      Elenco.ambiente(pal.renderer, D.scene, { forca: 0.3 });
      const cam = new THREE.PerspectiveCamera(40, 16 / 9, 0.05, 160);
      const JAN = M(-2.0, 2.2, 0.3);
      const planos = [
        { t0: 0, t1: 3.5, w: F, pos: JAN, alvo: (t) => V(-1.15, 1.45, -3.9 + 0.35 * t), fov: 21, mao: true },
        { t0: 3.5, t1: 7, w: D, pos: M(-1.45, 2.5, 1.2), alvo: M(-1.7, 2.0, -0.62), fov: 30, mao: true },   // por fora do vidro, alto e de lado: a cruz da janela não passa no rosto
        { t0: 7, t1: 8, w: D, pos: M(-0.2, 2.4, -3.0), alvo: M(-2.7, 1.45, -0.7), fov: 52, mao: true },          // ela corre para a porta do quarto
        { t0: 8, t1: 9, w: D, pos: M(1.2, 2.3, -3.6), alvo: M(3.3, 1.5, -0.6), fov: 54, mao: true },
        { t0: 9, t1: 10, w: F, pos: V(-5.3, 1.9, 6.3), alvo: V(-6.6, 1.6, 8.4), fov: 48, mao: true },
        { t0: 10, t1: 11, w: F, pos: V(-6.2, 2.0, 3.3), alvo: V(-6.6, 1.6, 6.8), fov: 44, mao: true },
        { t0: 11, t1: 14, w: F, pos: V(-6.0, 1.95, 3.6), alvo: V(-6.5, 1.5, 6.1), fov: 42, mao: true },
        { t0: 14, t1: 17, w: F, pos: V(-5.6, 2.0, 4.9), alvo: V(-6.6, 1.95, 6.3), fov: 32, mao: true },
        { t0: 17, t1: 20, w: F, pos: V(-6.0, 2.2, 5.0), alvo: V(-0.9, 1.7, -3.4), fov: 17, mao: true },
        { t0: 20, t1: 23, w: F, pos: V(-6.35, 2.0, 4.1), alvo: V(-6.6, 1.85, 6.3), fov: 36, mao: true },
      ];
      // o Gabi arrastado: do quintal (-4,6), pelo portão aberto, até dentro da van (a traseira em x -0,1)
      const TG = [V(-1.2, 0, -4.6), V(-1.2, 0, -3.0), V(-0.9, 0, -1.5), V(-0.55, 0, 0.1), V(0.4, 0, 0.1)];
      // o agente 2 vai da porta até a van depois que o Gabi entra (7-10,6), contornando os pais
      const TA2 = [AG2, V(-1.2, 0, -3.0), V(-0.9, 0, -1.5), V(-0.55, 0, 0.1), V(0.4, 0, 0.1)];
      // a Duda: dentro (quarto → cozinha), fora (porta da frente → portão)
      const TQ = [M(-1.7, 0, -0.62), M(-2.6, 0, -1.0), M(-3.35, 0, -0.75)];   // da janela até a porta do quarto
      const TC = [M(1.1, 0, -0.9), M(3.3, 0, -0.6), M(4.05, 0, -0.25)];
      const TF = [V(-6.6, 0, R.FZ2 - 0.25), V(-6.6, 0, 6.3)];
      const PG = V(-6.6, 0, 6.3);
      const estado = { t: 0 };
      function render() {
        const t = estado.t, p = EP2.plano(planos, t);
        const W = p.w;
        W.scene.updateMatrixWorld(true);
        // ---------------- FORA ----------------
        const gi = R.giroflex(t, 1);
        const fecha = S((t - 11.1) / 0.4);                              // o clangor em 11,5
        for (const { pt, s } of R.portasVan) pt.rotation.y = s * 2.75 * (1 - fecha);
        const vai = S((t - 14.0) / 3.2);
        R.van.position.x = 2.4 + 22 * Math.pow(vai, 1.6);
        G.portaoGabi(1); G.portaGabi(3.3);                              // portão aberto, a porta arrebentada (rente à parede)
        G.portaoDuda(0);
        portaLuz.visible = t >= 9 && t < 11;
        // o Gabi + os agentes 1 (ao lado, segurando o braço) e 3 (atrás, empurrando)
        const ug = Math.min(1, t / 6.4), cg = EP2.caminho(TG, ug), dentroVan = t > 6.5;
        gabi.position.copy(cg.pos); gabi.rotation.y = cg.ry + Math.sin(t * 7.3) * 0.16 + Math.sin(t * 4.1) * 0.08;   // se debate
        gabi.visible = !dentroVan;
        EP2.anda(gabi, t, 0.55, 1.3);                                   // passo travado, arrastado
        poe(rg.aR, AGARRA_E); poe(rg.aL, AGARRA_D);
        Elenco.mao(gabi, "esq", "punho", 1); Elenco.mao(gabi, "dir", "punho", 1);
        Elenco.cabeca(gabi, -0.05, 0, Math.sin(t * 4.7) * 0.1);
        Elenco.vida(gabi, t, { ritmo: "medo", ouvir: [[0, 0], [1.0, 1.0], [4.2, -0.6]] });
        EP2.boca(gabi, t, ["c10-gabi-05"], CENA);
        gabi.updateMatrixWorld(true);
        const g1 = gabi.localToWorld(V(-0.55, 0, -0.35)), g3 = gabi.localToWorld(V(0.1, 0, -0.95));
        ag[0].position.set(g1.x, EP2.chao(g1.x, g1.z), g1.z); ag[0].rotation.y = cg.ry; ag[0].visible = !dentroVan;
        ag[2].position.set(g3.x, EP2.chao(g3.x, g3.z), g3.z); ag[2].rotation.y = cg.ry; ag[2].visible = !dentroVan;
        for (const a of [ag[0], ag[2]]) EP2.anda(a, t, 0.8, 1.3);
        F.scene.updateMatrixWorld(true);
        if (!dentroVan) {
          Elenco.alcancar(ag[0], "esq", gabi.localToWorld(V(-0.3, 1.62, 0.0)), { foraDoCorpo: true });   // o braço dele, acima do cotovelo
          Elenco.alcancar(ag[2], "esq", gabi.localToWorld(V(0.18, 1.6, -0.25)), { foraDoCorpo: true });  // as costas
          Elenco.alcancar(ag[2], "dir", gabi.localToWorld(V(-0.18, 1.6, -0.25)), { foraDoCorpo: true });
        }
        // o agente 2: barra os pais até 7, depois vai para a van
        if (t < 7) {
          ag[1].position.copy(AG2); ag[1].rotation.y = Math.PI; ag[1].visible = true;
          F.scene.updateMatrixWorld(true);
          Elenco.alcancar(ag[1], "esq", V(-1.3, 1.65, FZ + 0.85), { foraDoCorpo: true });
          Elenco.alcancar(ag[1], "dir", V(-0.45, 1.65, FZ + 0.95), { foraDoCorpo: true });
        } else {
          const u2 = (t - 7) / 3.6, c2 = EP2.caminho(TA2, u2);
          ag[1].position.copy(c2.pos); ag[1].rotation.y = c2.ry; ag[1].visible = u2 < 1;
          EP2.anda(ag[1], t, 1, 1.6);
        }
        for (let i = 0; i < 3; i++) Elenco.vida(ag[i], t, { ritmo: "calmo", fase: i + 2 });
        // os pais: contidos na porta; depois do agente sair, a mãe corre até o portão (17,0-18,1) e chama a rua
        pai.position.copy(PAI0); pai.rotation.y = 0.15;
        F.scene.updateMatrixWorld(true);
        if (t < 7) Elenco.alcancar(pai, "esq", V(-1.05, 1.75, FZ + 0.95), { foraDoCorpo: true });     // empurra o braço do agente
        else { poe(pai.userData.rig.aR, SOLTO); poe(pai.userData.rig.aL, SOLTO); }                   // o agente saiu: os braços caem
        Elenco.cabeca(pai, 0, 0.15, 0);
        Elenco.vida(pai, t, { ritmo: "medo", fase: 5 });
        EP2.boca(pai, t, [], CENA);
        const corre = S((t - 17.0) / 1.1);
        const pm = MAE0.clone().lerp(V(-0.9, 0, -3.35), corre);
        mae.position.copy(pm);
        mae.rotation.y = t < 17 ? 0.35 : t < 18.1 ? EP2.olhaPara(MAE0, V(-0.9, 0, -3.35)) : 0.25;   // no portão: de frente para a rua, puxada para onde a van foi
        EP2.anda(mae, t, t > 17 && t < 18.1 ? 1.3 : 0, 2.4);
        F.scene.updateMatrixWorld(true);
        if (t < 17) Elenco.alcancar(mae, "dir", V(0.1, 1.9, FZ + 2.2), { foraDoCorpo: true });          // estica o braço para o filho
        else if (t > 18.1) Elenco.alcancar(mae, "dir", mae.localToWorld(V(-0.75, 1.45, 0.4)), { foraDoCorpo: true });   // o braço para a rua vazia, baixo e de lado (a boca à mostra)
        Elenco.cabeca(mae, -0.08, t > 18.1 ? -0.35 : 0.2, 0);
        Elenco.vida(mae, t, { ritmo: "choro", fase: 6 });
        EP2.boca(mae, t, ["c10-mae-04", "c10-mae-05a"], CENA);
        // a Duda lá fora: sai pela porta (9,0) e corre até o portão (10,9); a mão na grade; travada
        dOut.visible = t >= 9;
        if (t >= 9) {
          const uf = S((t - 9.0) / 1.9), cf = EP2.caminho(TF, uf);
          dOut.position.copy(cf.pos); dOut.rotation.y = Math.PI;
          EP2.anda(dOut, t, t < 10.9 ? 1.4 : 0, 2.6);
          F.scene.updateMatrixWorld(true);
          if (t >= 10.9) {
            Elenco.alcancar(dOut, "dir", V(-6.45, 1.17, 5.9), { foraDoCorpo: true });                 // a mão na grade
            Elenco.mao(dOut, "dir", "segura", 0.9);
          }
          // olha para onde a van está (à direita dela); no fim, para a mãe do Gabi
          Elenco.cabeca(dOut, -0.04, t < 10.9 ? 0 : t < 17 ? -0.55 - 0.25 * vai : -0.45, 0);
          EP2.expr(dOut, "medo");
          Elenco.vida(dOut, t, { ritmo: t < 14 ? "medo" : "tensao", corpo: t >= 10.9 });
          EP2.boca(dOut, t, [], CENA);
        }
        // a sirene no rosto dela: forte quando a van passa, e some
        sirF.color.setHex(gi.azul ? 0x4a6bff : 0xff3a3a);
        sirF.intensity = (gi.azul || gi.vermelho) ? 5 * (1 - S((t - 14.6) / 2.2)) : 0;
        sirF.position.set(-5.2 + 3 * vai, 2.2, 4.4);
        // ---------------- DENTRO ----------------
        sir.color.setHex(gi.azul ? 0x4a6bff : 0xff3a3a);
        sir.intensity = (gi.azul || gi.vermelho) ? 2.4 : 0;
        sir.position.copy(M(-2.0, 2.1, 0.9));
        if (t < 8) {
          // na janela (3,5-7,0): a respiração curta, as mãos apertando o peitoril; depois vira e corre pelo quarto
          const uq = Math.max(0, (t - 7.0) / 1.0), cq = EP2.caminho(TQ, uq);
          dIn.position.copy(cq.pos);
          dIn.rotation.y = t < 7 ? EP2.olhaPara(M(-1.7, 0, -0.62), M(-1.7, 0, 1.0)) : cq.ry;
          EP2.anda(dIn, t, t < 7 ? 0 : 1.4, 2.6);
          D.scene.updateMatrixWorld(true);
          if (t < 7) {
            Elenco.alcancar(dIn, "dir", M(-2.12, 1.3, -0.2), { foraDoCorpo: true });
            Elenco.alcancar(dIn, "esq", M(-1.28, 1.3, -0.2), { foraDoCorpo: true });
            Elenco.mao(dIn, "dir", "punho", 0.8); Elenco.mao(dIn, "esq", "punho", 0.8);
          }
          Elenco.cabeca(dIn, -0.02, t < 7 ? 0.3 : 0, 0);
        } else {
          // a cozinha: até a porta da frente, que abre (8,6)
          const uc = (t - 8.0) / 1.0, cc = EP2.caminho(TC, uc);
          dIn.position.copy(cc.pos); dIn.rotation.y = cc.ry;
          EP2.anda(dIn, t, 1.4, 2.6);
          Elenco.cabeca(dIn, 0, 0, 0);
        }
        C.abrePorta(S((t - 8.5) / 0.3));
        EP2.expr(dIn, "medo");
        Elenco.vida(dIn, t, { ritmo: "medo", corpo: t < 7 });
        EP2.boca(dIn, t, [], CENA);
        EP2.camera(cam, p, t);
        pal.render(W.scene, cam, t);
      }
      const tl = gsap.timeline({ paused: true, onUpdate: render });
      tl.fromTo(estado, { t: 0 }, { t: DUR, duration: DUR, ease: "none" }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines[CENA] = tl;
      render();
    })();
  </script>
</template>
