<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <script src="assets/rig/elenco.js"></script>
    <script src="assets/rig/pos.js"></script>
    <script src="assets/rig/cena.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #12151c; }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1920" data-height="1080">
      <div id="elenco" data-composition-id="elenco" data-composition-src="compositions/elenco.html"
        data-start="0" data-duration="8" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="quarto" data-composition-id="quarto" data-composition-src="compositions/quarto.html"
        data-start="8" data-duration="8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="sala" data-composition-id="sala" data-composition-src="compositions/sala.html"
        data-start="16" data-duration="8" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cozinha" data-composition-id="cozinha" data-composition-src="compositions/cozinha.html"
        data-start="24" data-duration="8" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="rua" data-composition-id="rua" data-composition-src="compositions/rua.html"
        data-start="32" data-duration="8" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
