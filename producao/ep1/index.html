<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <script src="assets/rig/elenco.js"></script>
    <style>
      :root { --ground: #e9e9ee; --ink: #33363f; --font-display: sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      #stage { position: absolute; inset: 0; z-index: 0; }
      #stage canvas { display: block; }
      .vlabel { position: absolute; bottom: 40px; width: 300px; text-align: center; z-index: 2;
        color: var(--ink); font-size: 32px; font-weight: 700; letter-spacing: .04em; }
      .vlabel small { display: block; font-size: 28px; font-weight: 400; color: #5c5f69; letter-spacing: 0; margin-top: 4px; }
      #l1 { left: 102px; }
      #l2 { left: 462px; }
      #l3 { left: 810px; }
      #l4 { left: 1158px; }
      #l5 { left: 1518px; }
      .xcol { position:absolute; top:168px; width:180px; text-align:center; z-index:2; color:#5c5f69; font-size:28px; font-weight:700; }
      .xrow { position:absolute; left:40px; width:240px; z-index:2; color:var(--ink); font-size:32px; font-weight:700; letter-spacing:.04em; }
      #title { position:absolute; top:44px; left:0; width:100%; text-align:center; color:var(--ink);
        font-size:40px; font-weight:700; letter-spacing:-.01em; z-index:2; }
      .sub { position:absolute; top:98px; left:0; width:100%; text-align:center; color:#5c5f69; font-size:30px; font-weight:700; letter-spacing:.12em; z-index:2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-start="0" data-duration="8" data-track-index="0">ELENCO EP1 — line-up em escala (procedural · Three.js)</div>
      <div id="sub1" class="sub clip" data-start="0" data-duration="2" data-track-index="1">FRENTE</div>
      <div id="sub2" class="sub clip" data-start="2" data-duration="2" data-track-index="1">3/4</div>
      <div id="sub3" class="sub clip" data-start="4" data-duration="2" data-track-index="1">COSTAS</div>
      <div id="sub4" class="sub clip" data-start="6" data-duration="2" data-track-index="1">EXPRESSÕES</div>
      <div id="c0" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:310px">neutro</div>
      <div id="c1" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:499px">medo</div>
      <div id="c2" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:687px">triste</div>
      <div id="c3" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:876px">choro</div>
      <div id="c4" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:1064px">raiva</div>
      <div id="c5" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:1253px">grito</div>
      <div id="c6" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:1441px">ternura</div>
      <div id="c7" class="xcol clip" data-start="6" data-duration="2" data-track-index="8" style="left:1630px">firme</div>
      <div id="r0" class="xrow clip" data-start="6" data-duration="2" data-track-index="9" style="top:265px">GABI</div>
      <div id="r1" class="xrow clip" data-start="6" data-duration="2" data-track-index="9" style="top:430px">GABI CEGO</div>
      <div id="r2" class="xrow clip" data-start="6" data-duration="2" data-track-index="9" style="top:595px">MÃE</div>
      <div id="r3" class="xrow clip" data-start="6" data-duration="2" data-track-index="9" style="top:760px">PAI</div>
      <div id="r4" class="xrow clip" data-start="6" data-duration="2" data-track-index="9" style="top:925px">DUDA</div>
      <div id="stage" class="clip" data-start="0" data-duration="8" data-track-index="2"></div>
      <div id="l1" class="vlabel clip" data-start="0" data-duration="6" data-track-index="3">MÃE<small>enxerga · branca</small></div>
      <div id="l2" class="vlabel clip" data-start="0" data-duration="6" data-track-index="4">PAI<small>enxerga · negro</small></div>
      <div id="l3" class="vlabel clip" data-start="0" data-duration="6" data-track-index="5">GABI<small>17 · cego no dia 1</small></div>
      <div id="l4" class="vlabel clip" data-start="0" data-duration="6" data-track-index="6">DUDA<small>16 · vizinha</small></div>
      <div id="l5" class="vlabel clip" data-start="0" data-duration="6" data-track-index="7">AGENTE<small>equipe de isolamento</small></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__vista = { t: 0 };
      window.__timelines["main"].to(window.__vista, { t: 8, duration: 8, ease: "none" }, 0);
    </script>

    <script>
      (function () {
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9e9ee);
        scene.add(new THREE.AmbientLight(0xffffff, 0.78));
        const key = new THREE.DirectionalLight(0xffffff, 1.05); key.position.set(-3, 5, 4); scene.add(key);
        const rim = new THREE.DirectionalLight(0xbcd0e6, 0.3); rim.position.set(3, 2, -3); scene.add(rim);

        // 8 unidades de largura -> 240 px por unidade; centros dos rótulos em x = 960 + 240·X
        // frustum relativo à câmera (y=1.5): mundo de y=-0.75 a y=3.75
        const cam = new THREE.OrthographicCamera(-4, 4, 2.25, -2.25, 0.1, 100);
        cam.position.set(0, 1.5, 12); cam.lookAt(0, 1.5, 0);

        const ordem = [["mae", -3.0], ["pai", -1.5], ["gabi", 0], ["duda", 1.45], ["agente", 2.95]];
        const bonecos = ordem.map(([id, x]) => {
          const p = Elenco.build(id); p.position.x = x; scene.add(p); return p;
        });
        // 0-2 s frente · 2-4 s 3/4 · 4-6 s costas (cortes secos, sem giro)
        const VISTAS = [-0.12, -0.8, Math.PI];

        const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
        renderer.setPixelRatio(1); renderer.setSize(1920, 1080);
        document.getElementById('stage').appendChild(renderer.domElement);
        // folha de expressões (6-8 s): só as cabeças, 4 linhas x 8 colunas
        const sceneX = new THREE.Scene(); sceneX.background = scene.background;
        sceneX.add(new THREE.AmbientLight(0xffffff, 0.78));
        const kx = key.clone(); sceneX.add(kx); const rx = rim.clone(); sceneX.add(rx);
        const PX = 174.5; // px por unidade (11 unidades de largura)
        const camX = new THREE.OrthographicCamera(-5.5, 5.5, 540 / PX, -540 / PX, 0.1, 100);
        camX.position.set(0, 0, 12); camX.lookAt(0, 0, 0);
        const EXS = ["neutro", "medo", "triste", "choro", "raiva", "grito", "ternura", "firme"];
        [["gabi"], ["gabi", { blind: true }], ["mae"], ["pai"], ["duda"]].forEach(([id, extra], j) => {
          EXS.forEach((nome, i) => {
            const p = Elenco.build(id, Object.assign({ expr: nome }, extra));
            const cab = p.userData.rig.head; p.remove(cab);
            cab.scale.setScalar(0.8);
            cab.position.set((100 + (i - 3.5) * 188.5) / PX, -(285 + j * 165 - 540) / PX, 0);
            cab.rotation.y = -0.18;
            sceneX.add(cab);
          });
        });
        function renderAt() {
          const t = window.__vista.t;
          if (t >= 6) { renderer.render(sceneX, camX); return; }
          const v = VISTAS[Math.min(2, Math.floor(t / 2))];
          for (const p of bonecos) p.rotation.y = v;
          renderer.render(scene, cam);
        }
        window.__timelines["main"].eventCallback("onUpdate", renderAt);
        window.addEventListener('hf-seek', renderAt);
        renderAt();
      })();
    </script>
  </body>
</html>
