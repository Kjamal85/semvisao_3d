<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/three.min.js"></script>
    <style>
      :root { --ground: #e9e9ee; --ink: #33363f; --font-display: sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      #stage { position: absolute; inset: 0; z-index: 0; }
      #stage canvas { display: block; }
      .vlabel { position: absolute; bottom: 22px; width: 420px; text-align: center; z-index: 2;
        color: var(--ink); font-size: 34px; font-weight: 700; letter-spacing: .04em; }
      #l1 { left: 120px; }
      #l2 { left: 750px; }
      #l3 { left: 1380px; }
      #title { position:absolute; top:44px; left:0; width:100%; text-align:center; color:var(--ink);
        font-size:40px; font-weight:700; letter-spacing:-.01em; z-index:2; }
      #sub { position:absolute; top:98px; left:0; width:100%; text-align:center; color:#6a6d77; font-size:28px; z-index:2; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1920" data-height="1080">
      <div id="title" class="clip" data-start="0" data-duration="3" data-track-index="0">GABI — prova de 3 vistas (procedural · Three.js)</div>
      <div id="sub" class="clip" data-start="0" data-duration="3" data-track-index="1">formas simples · juntas por número · cabeça ~0,31 da altura</div>
      <div id="stage" class="clip" data-start="0" data-duration="3" data-track-index="2"></div>
      <div id="l1" class="vlabel clip" data-start="0" data-duration="3" data-track-index="3">FRENTE</div>
      <div id="l2" class="vlabel clip" data-start="0" data-duration="3" data-track-index="4">PERFIL</div>
      <div id="l3" class="vlabel clip" data-start="0" data-duration="3" data-track-index="5">DESPERTAR CEGO</div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>

    <script>
      (function () {
        const C = { skin:0xc68e62, hair:0x241c17, top:0xaed0ec, pants:0x454551,
                    shoe:0x2d2d36, dark:0x24242a, eyeW:0xffffff, blind:0x6a6a71, glintB:0xecebe4, glint:0xffffff };
        const mat = (c)=> new THREE.MeshToonMaterial({ color: c });
        const outlineMat = new THREE.MeshBasicMaterial({ color: 0x1b1b20, side: THREE.BackSide });

        function buildGabi(opts){
          opts = opts || {};
          const g = new THREE.Group();
          const add = (geo,c,x,y,z,parent)=>{
            const p = parent||g;
            const o = new THREE.Mesh(geo, outlineMat); o.position.set(x,y,z); o.scale.multiplyScalar(1.07); p.add(o);
            const m = new THREE.Mesh(geo, mat(c)); m.position.set(x,y,z); p.add(m); return m;
          };
          add(new THREE.CylinderGeometry(0.12,0.12,1.05,16), C.pants, -0.14, 0.55, 0);
          add(new THREE.CylinderGeometry(0.12,0.12,1.05,16), C.pants,  0.14, 0.55, 0);
          add(new THREE.BoxGeometry(0.22,0.12,0.34), C.shoe, -0.14, 0.06, 0.06);
          add(new THREE.BoxGeometry(0.22,0.12,0.34), C.shoe,  0.14, 0.06, 0.06);
          add(new THREE.CylinderGeometry(0.30,0.26,0.82,20), C.top, 0, 1.5, 0);
          const hood = add(new THREE.SphereGeometry(0.26,18,14), C.top, 0, 1.92, -0.14); hood.scale.set(1.15,0.7,0.85);
          add(new THREE.BoxGeometry(0.34,0.16,0.06), C.top, 0, 1.2, 0.27);
          const hp = add(new THREE.TorusGeometry(0.24,0.05,10,24), C.dark, 0, 1.93, 0.02); hp.rotation.x = Math.PI/2;
          add(new THREE.SphereGeometry(0.075,12,12), C.dark, -0.24,1.93,0.02);
          add(new THREE.SphereGeometry(0.075,12,12), C.dark,  0.24,1.93,0.02);
          function arm(side){
            const sh=new THREE.Group(); sh.position.set(side*0.30,1.85,0); g.add(sh);
            add(new THREE.CylinderGeometry(0.09,0.085,0.46,14), C.top, 0,-0.23,0, sh);
            const el=new THREE.Group(); el.position.set(0,-0.46,0); sh.add(el);
            add(new THREE.CylinderGeometry(0.08,0.075,0.44,14), C.top, 0,-0.22,0, el);
            add(new THREE.SphereGeometry(0.10,14,12), C.skin, 0,-0.46,0, el);
            return {sh,el};
          }
          const aL=arm(-1), aR=arm(1);
          const head=new THREE.Group(); head.position.set(0,2.2,0); g.add(head);
          add(new THREE.SphereGeometry(0.40,28,22), C.skin, 0,0,0, head);
          add(new THREE.SphereGeometry(0.415,24,18,0,Math.PI*2,0,Math.PI*0.62), C.hair, 0,0.02,-0.03, head);
          add(new THREE.BoxGeometry(0.52,0.12,0.18), C.hair, 0,0.30,0.25, head);
          const br = (opts.browRaise||0);
          function eye(side){
            const ex=side*0.15, ey=-0.05, ez=0.36;
            if(opts.blind){
              add(new THREE.SphereGeometry(0.078,16,12), C.blind, ex,ey,ez, head);
              add(new THREE.SphereGeometry(0.02,8,8), C.glintB, ex-0.028,ey+0.02,ez+0.05, head);
            } else {
              add(new THREE.SphereGeometry(0.082,16,12), C.eyeW, ex,ey,ez, head);
              add(new THREE.SphereGeometry(0.042,12,12), C.dark, ex,ey,ez+0.045, head);
              add(new THREE.SphereGeometry(0.015,8,8), C.glint, ex-0.022,ey+0.022,ez+0.08, head);
            }
            add(new THREE.BoxGeometry(0.13,0.028,0.05), C.hair, ex,0.11+br*0.06,0.37, head);
          }
          eye(-1); eye(1);
          add(new THREE.BoxGeometry(0.13,0.03,0.04), C.dark, 0,-0.21,0.37, head);
          if(opts.arm==="hands_to_face"){
            aL.sh.rotation.x=-2.25; aL.sh.rotation.z= 0.35; aL.el.rotation.x=-1.7;
            aR.sh.rotation.x=-2.25; aR.sh.rotation.z=-0.35; aR.el.rotation.x=-1.7;
            head.rotation.x=0.22;
          }
          return g;
        }

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe9e9ee);
        scene.add(new THREE.AmbientLight(0xffffff,0.78));
        const key = new THREE.DirectionalLight(0xffffff,1.05); key.position.set(-3,5,4); scene.add(key);
        const rim = new THREE.DirectionalLight(0xbcd0e6,0.3); rim.position.set(3,2,-3); scene.add(rim);

        // frustum relativo à câmera (y=1.5): mostra o mundo de y=-0.35 (abaixo dos pés) a y=3.25 (acima da cabeça)
        const cam = new THREE.OrthographicCamera(-3.2,3.2,1.75,-1.85,0.1,100);
        cam.position.set(0,1.5,12); cam.lookAt(0,1.5,0);

        const front=buildGabi({}); front.position.x=-2.1; scene.add(front);
        const prof =buildGabi({}); prof.position.x=0; prof.rotation.y=Math.PI/2; scene.add(prof);
        const act  =buildGabi({blind:true,browRaise:1,arm:"hands_to_face"}); act.position.x=2.1; scene.add(act);

        const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
        renderer.setPixelRatio(1); renderer.setSize(1920,1080);
        document.getElementById('stage').appendChild(renderer.domElement);
        function renderAt(){ renderer.render(scene,cam); }
        window.addEventListener('hf-seek', renderAt);
        renderAt();
      })();
    </script>
  </body>
</html>
